/* ---------- sync format v2: every plan and its data ---------- */
function packData(d) { return { plan: d.plan, planU: d.planU || 0, ticks: d.ticks || {}, ticksU: d.ticksU || 0,
  weights: [...(d.weights || [])].sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0) }; }
function packLocal(st) {
  const data = {}; for (const id in (st.cfgData || {})) data[id] = packData(st.cfgData[id]);
  if (st.active) data[st.active] = packData(st);
  return { v: 2, configs: [...(st.configs || [])].sort((a, b) => a.id < b.id ? -1 : 1), data,
    selected: st.selected || [], selectedU: st.selectedU || 0, hhTicks: st.hhTicks || {}, hhTicksU: st.hhTicksU || 0 };
}
function normRemote(r, st) {
  if (!r) return null;
  if (r.v === 2) return { v: 2, configs: [...(r.configs || [])].sort((a, b) => a.id < b.id ? -1 : 1), data: Object.fromEntries(Object.entries(r.data || {}).map(([k, d]) => [k, packData(d)])),
    selected: r.selected || [], selectedU: r.selectedU || 0, hhTicks: r.hhTicks || {}, hhTicksU: r.hhTicksU || 0 };
  // older single-plan file: it belongs to this device's current plan
  const id = st.active || "c-synced";
  const configs = r.profile && !st.active ? [Object.assign({}, r.profile, { id, name: r.profile.name || "My plan", u: r.profileU || 1 })] : [];
  return { v: 2, configs, data: { [id]: packData(r) } };
}
function mergeOne(st, remote) {
  let changed = false;
  if (remote.plan && (remote.planU || 0) > (st.planU || 0)) { st.plan = remote.plan; st.planU = remote.planU; changed = true; }
  if ((remote.ticksU || 0) > (st.ticksU || 0)) { st.ticks = remote.ticks || {}; st.ticksU = remote.ticksU; changed = true; }
  const by = {}; for (const w of (st.weights || [])) by[w.d] = w;
  for (const w of (remote.weights || [])) { const cur = by[w.d];
    if (!cur || (w.u || 0) > (cur.u || 0)) { if (!cur || canon(cur) !== canon(w)) changed = true; by[w.d] = w; } }
  st.weights = Object.values(by);
  return changed;
}

function mergeAll(st, remote) {
  if (!remote) return false;
  if (remote.v !== 2) return mergeOne(st, packData(remote));      // older single-plan file -> this device's current plan
  const R2 = normRemote(remote, st); let changed = false;
  const by = {}; for (const c of (st.configs || [])) by[c.id] = c;
  for (const c of R2.configs) { const cur = by[c.id]; if (!cur || (c.u || 0) > (cur.u || 0)) { if (!cur || canon(cur) !== canon(c)) changed = true; by[c.id] = c; } }
  st.configs = Object.values(by); st.cfgData = st.cfgData || {};
  for (const id in R2.data) {
    if (id === st.active) { if (mergeOne(st, R2.data[id])) changed = true; }
    else { const t = st.cfgData[id] || (st.cfgData[id] = freshData()); if (mergeOne(t, R2.data[id])) changed = true; }
  }
  if ((R2.selectedU || 0) > (st.selectedU || 0)) { st.selected = R2.selected.slice(); st.selectedU = R2.selectedU; changed = true; }
  if ((R2.hhTicksU || 0) > (st.hhTicksU || 0)) { st.hhTicks = R2.hhTicks || {}; st.hhTicksU = R2.hhTicksU; changed = true; }
  st.selected = (st.selected || []).filter(id => planById(id));
  if (st.active && !planById(st.active)) st.active = null;
  if (st.active && !st.selected.includes(st.active)) st.selected.unshift(st.active);
  if (st.selected.length < 2) st.view = "person";
  return changed;
}

/* ---------- cooking for several people: switcher + "Everyone" views ---------- */
function ALL() { return S.view === "all" && S.selected.length > 1; }
function gramsFor(it, fac) { return it.f === "F08" ? scaledVal("F08", it.g / 50, "egg", fac) * 50 : GRP[it.f] ? scaledVal(it.f, it.g, "g", fac) : it.g; }
function macroFor(rid, fac) {
  const o = { kcal: 0, p: 0, c: 0, f: 0, cost: 0 }, r = R0[rid]; if (!r) return o;
  for (const it of r.ing) { const fd = F[it.f]; if (!fd) continue; const g = gramsFor(it, fac), k = g / 100;
    o.kcal += k * (fd.kcal || 0); o.p += k * (fd.p || 0); o.c += k * (fd.c || 0); o.f += k * (fd.f || 0); o.cost += fd.pack > 0 ? g * fd.price / fd.pack : 0; }
  return o;
}
function peopleSel() {
  return S.selected.map(id => { const p = profileFor(id); if (!p) return null; const t = computeTargets(p);
    return { id, name: p.name, p, t, fac: id === S.active ? FAC : computeFactors(t), data: id === S.active ? S : (S.cfgData[id] || freshData()) }; }).filter(Boolean);
}
function personDay(pp, day) { const t = { kcal: 0, p: 0, cost: 0 };
  for (const id of [...((pp.data.plan || {})[day] || []), "X1"]) { const m = macroFor(id, pp.fac); t.kcal += m.kcal; t.p += m.p; t.cost += m.cost; } return t; }
function targetFor(pp, iso) {
  const tot = Math.max(1, dayDiff(pp.p.startDate, pp.t.goalDate)), n = Math.max(0, Math.min(tot, dayDiff(pp.p.startDate, iso)));
  return pp.p.weight - (n <= 14 ? pp.t.water * n / 14 : pp.t.water) - Math.max(0, pp.p.weight - pp.p.goal - pp.t.water) * n / tot;
}

/* ---------- links: every page has its own address ----------
   #today #week #recipes #shop #weight | #prep #eating-out (Recipes sub-pages) | #recipe-L3 | #monday ... #sunday */
const TABS = ["today", "week", "recipes", "shop", "weight"];
let curTab = null, lastRoute = null, sheetPushed = false;
function setHash(h, push) {
  if ("#" + h === location.hash) return;
  try { history[push ? "pushState" : "replaceState"](null, "", "#" + h); } catch (e) { try { location.replace("#" + h); } catch (_) {} }
}
function go(h) { setHash(h, true); route(); }
function route() {
  lastRoute = location.hash;
  const h = decodeURIComponent(location.hash.slice(1)), lh = h.toLowerCase();
  const before = curTab + "|" + selDay + "|" + recSeg;
  let tab, recipe = null, sheet = null;
  if (TABS.includes(lh)) { tab = lh; if (lh === "today") selDay = todayName; if (lh === "recipes") recSeg = "meals"; }
  else if (lh === "prep" || lh === "eating-out") { tab = "recipes"; recSeg = lh === "prep" ? "prep" : "out"; }
  else if (lh.startsWith("recipe-") && R[h.slice(7).toUpperCase()]) { recipe = h.slice(7).toUpperCase(); tab = curTab || "recipes"; }
  else if (DAYS.some(d => d.toLowerCase() === lh)) { tab = "today"; selDay = DAYS.find(d => d.toLowerCase() === lh); }
  else if (lh === "plans") { tab = curTab || "today"; sheet = () => openPlans(!S.active); }
  else if (lh === "setup") { tab = curTab || "today"; sheet = () => openSetup("new"); }
  else if (lh.startsWith("edit-")) { tab = curTab || "today"; sheet = () => openSetup("edit", h.slice(5)); }
  else if (lh.startsWith("copy-")) { tab = curTab || "today"; sheet = () => openSetup("copy", h.slice(5)); }
  else { tab = curTab || "today"; }
  const sheetOpen = !$("#sheet").hidden;
  if (sheetOpen && !recipe && !sheet) closeSheetUI();
  if (curTab + "|" + selDay + "|" + recSeg !== before || tab !== curTab || (!sheetOpen && !recipe && !sheet)) showTab(tab);
  if (recipe) openRecipe(recipe);
  if (sheet) sheet();
}
window.addEventListener("popstate", () => { if (location.hash !== lastRoute) route(); });
window.addEventListener("hashchange", () => { if (location.hash !== lastRoute) route(); });

      if (isBullets) return `<div class="card stack"><h3>${esc(title)}</h3><ul class="tips small">${sec.rows.map(r => `<li>${esc(String(r[0]).replace(/^\u2022\s*/, ""))}</li>`).join("")}</ul></div>`;
      const solo = r => r.slice(1).every(v => v === "");
      const cell = v => v && typeof v === "object" ? (v.href ? `<a href="${esc(v.href)}" target="_blank" rel="noopener">${esc(v.t || "source")}</a>` : esc(v.t)) : esc(typeof v === "number" ? fmt(v, v % 1 ? 2 : 0) + " K\u010d" : v);
      const tRows = rows.filter(r => !solo(r)), notes = rows.filter(solo);
      const cols = head.map((h, j) => j).filter(j => head[j] !== "" || tRows.some(r => r[j] !== ""));
      const body2 = tRows.map(r => `<tr>${cols.map(j => `<td${j === 0 ? ' style="font-weight:700"' : ""}>${cell(r[j])}</td>`).join("")}</tr>`).join("");
      return `<div class="card stack"><h3>${esc(title)}</h3><div class="tbl-wrap"><table class="eo-table"><thead><tr>${cols.map(j => `<th>${esc(head[j])}</th>`).join("")}</tr></thead><tbody>${body2}</tbody></table></div>${notes.map(r => `<p class="small muted">${cell(r[0])}</p>`).join("")}</div>`; }).join("");
  }
  $("#v-recipes").innerHTML = `<h1>Recipes</h1><div class="seg" role="group" aria-label="Recipe sections">${segs}</div>${body}`;
  const v = $("#v-recipes");
  v.querySelectorAll("[data-seg]").forEach(b => b.onclick = () => go({ meals: "recipes", prep: "prep", out: "eating-out" }[b.dataset.seg]));
  v.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { recFilter = b.dataset.f; renderRecipes(); });
  const rq = $("#rq"); if (rq) rq.oninput = e => { recQuery = e.target.value; const pos = e.target.selectionStart; renderRecipes(); const n = $("#rq"); n.focus(); n.setSelectionRange(pos, pos); };
  bindRecipeButtons(v);
  v.querySelectorAll("ol.steps li").forEach(li => li.onclick = () => li.classList.toggle("done"));
}

/* ---------- Shop ---------- */
let confirmClear = false;
function amountText(fd, g) {
  const q = fd.qty || ["g"];
  if (q[0] === "egg") return Math.ceil(g / q[1]) + " eggs";
  if (q[0] === "pc") return Math.ceil(g / q[1]) + (Math.ceil(g / q[1]) === 1 ? " pc" : " pcs") + " (~" + fmt(g) + " g)";
  if (q[0] === "ml") return g >= 1000 ? fmt(g / 1000, 1) + " l" : fmt(g) + " ml";
  return g >= 1000 ? fmt(g / 1000, 1) + " kg" : fmt(g) + " g";
}
function shopList() {
  const need = {}, per = {}, src = shopSources();
  for (const sc of src) for (const d of DAYS) for (const id of [...(sc.plan[d] || []), "X1"]) for (const it of (R0[id] || { ing: [] }).ing) {
    const g = gramsFor(it, sc.fac); need[it.f] = (need[it.f] || 0) + g;
    per[it.f] = per[it.f] || {}; per[it.f][sc.name] = (per[it.f][sc.name] || 0) + g; }
  const cats = []; const byCat = {};
  for (const fid in F) { const fd = F[fid]; if (fd.cat === "Eating out" || !need[fid]) continue;
    if (!byCat[fd.cat]) { byCat[fd.cat] = []; cats.push(fd.cat); }
    const g = need[fid]; const packs = fd.loose ? 0 : Math.ceil(g / fd.pack);
    const cost = fd.loose ? g / fd.pack * fd.price : packs * fd.price;
    const split = src.length > 1 ? Object.entries(per[fid]).map(([nm, v]) => nm + " " + amountText(fd, v)).join(" \u00b7 ") : "";
    byCat[fd.cat].push({ fid, fd, g, packs, cost, split }); }
  return { cats, byCat };
}
function renderShop() {
  const { cats, byCat } = shopList();
  let total = 0, left = 0, n = 0, done = 0;
  cats.forEach(c => byCat[c].forEach(x => { total += x.cost; n++; if (TK()[x.fid]) done++; else left += x.cost; }));
  const out = eatOutCost();
  const html = cats.map(c => `<div class="cat-h eyebrow">${esc(c)}</div>` + byCat[c].map(x => { const fd = x.fd, t = !!TK()[x.fid];
    const buy = fd.loose ? "by weight" : x.packs + " \u00d7 " + esc(fd.unit) + " (" + fmt(fd.pack) + (fd.qty && fd.qty[0] === "ml" ? " ml" : " g") + ")";
    return `<div class="shop-item ${t ? "ticked" : ""}">
      <input type="checkbox" id="tk-${x.fid}" data-tick="${x.fid}" ${t ? "checked" : ""} aria-label="Got ${esc(fd.en)}">
      <div class="grow" style="min-width:0"><label for="tk-${x.fid}" class="t" style="display:block">${esc(fd.en)}</label>
        <div class="s"><i>${esc(fd.cz)}</i></div><div class="s num">Need <b>${amountText(fd, x.g)}</b>${x.split ? ' <span class="muted">(' + esc(x.split) + ")</span>" : ""} \u00b7 buy ${buy}</div>
        <details><summary>Prices &amp; product</summary><div class="s" style="margin-top:4px">${esc(fd.product)} \u2013 ${esc(fd.store)}, ${fmt(fd.price, 2)} K\u010d${fd.seen ? " (seen " + esc(fd.seen) + ")" : ""}.</div>
          ${fd.other ? `<div class="s" style="margin-top:4px">Elsewhere: ${esc(fd.other)}</div>` : ""}${fd.notes ? `<div class="s" style="margin-top:4px">${esc(fd.notes)}</div>` : ""}</details></div>
      <div class="r num"><b>${fmt(x.cost)} K\u010d</b></div></div>`; }).join("")).join("");
  $("#v-shop").innerHTML = `<h1>Shopping list${ALL() ? " \u2013 everyone" : ""}</h1>
    <div class="kpis"><div class="kpi"><span class="eyebrow">Still to buy</span><b class="num">${fmt(left)} K\u010d</b><span class="small muted num">${n - done} of ${n} items</span></div>
      <div class="kpi"><span class="eyebrow">Full list</span><b class="num">${fmt(total)} K\u010d</b><span class="small muted">whole packs</span></div>
      <div class="kpi"><span class="eyebrow">Eating out</span><b class="num">${fmt(out)} K\u010d</b><span class="small muted">menus + flex</span></div></div>
    <p class="small muted">Built from this week's plan, so it changes when you swap meals. The first shop costs the most: oil, spices, honey and rice last several weeks, so tick them off if you already have them. Prices are regular shelf prices from Rohlik, Tesco, dm and Penny (Sep 2026); promotions are often cheaper.</p>
    <div class="list">${html}</div>
    ${(DATA.pantry || []).length ? `<div class="card stack"><h3>Pantry basics</h3><p class="small muted">Buy once \u2013 not in the totals above. Typical prices, not researched.</p><div class="tbl-wrap"><table class="eo-table"><tbody>${DATA.pantry.map(p => `<tr><td style="font-weight:700">${esc(p[0])}</td><td>${esc(p[1])}</td><td class="muted">${esc(p[2])}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
    <div id="clear-zone">${confirmClear ? `<div class="confirm">Untick everything?<button class="btn" id="clr-yes">Untick all</button><button class="btn ghost" id="clr-no">Cancel</button></div>` : `<button class="btn ghost" id="clr">Untick everything for next week</button>`}</div>`;
  const v = $("#v-shop");
  v.querySelectorAll("[data-tick]").forEach(cb => cb.onchange = () => { const T = TK(); if (cb.checked) T[cb.dataset.tick] = true; else delete T[cb.dataset.tick]; touchTK(); save(); renderShop(); });
  const c0 = $("#clr"); if (c0) c0.onclick = () => { confirmClear = true; renderShop(); };
  const cy = $("#clr-yes"); if (cy) cy.onclick = () => { clearTK(); save(); confirmClear = false; renderShop(); toast("All unticked"); };
  const cn = $("#clr-no"); if (cn) cn.onclick = () => { confirmClear = false; renderShop(); };
}

/* ---------- Weight ---------- */
const DEC = ((1.5).toLocaleString().match(/[^0-9]/) || ["."])[0];
let showBackup = false;
function chartSvg() {
  const W = 340, H = 210, L = 34, Rr = 10, T = 12, B = 28;
  const ws = weightsSorted();
  const kgs = ws.map(w => w.kg).concat([IN.start, IN.goal]);
  const ymin = Math.floor(Math.min(...kgs) - 1), ymax = Math.ceil(Math.max(...kgs) + 1);
  const x = iso => L + (W - L - Rr) * Math.max(0, Math.min(TOTALDAYS, dayDiff(IN.startDate, iso))) / TOTALDAYS;
  const y = kg => T + (H - T - B) * (ymax - kg) / (ymax - ymin);
  let g = "";
  for (let k = Math.ceil(ymin); k <= ymax; k += (ymax - ymin > 8 ? 2 : 1)) g += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(k)}" y2="${y(k)}"/><text class="axis" x="${L - 6}" y="${y(k) + 4}" text-anchor="end">${k}</text>`;
  const sd = parseD(IN.startDate);
  for (let m = 1; m <= 3; m++) { const d = new Date(sd.getFullYear(), sd.getMonth() + m, 1); const iso = isoDate(d); if (dayDiff(iso, IN.goalDate) < 0) break;
    g += `<line class="grid" x1="${x(iso)}" x2="${x(iso)}" y1="${T}" y2="${H - B}"/><text class="axis" x="${x(iso)}" y="${H - 8}" text-anchor="middle">${d.toLocaleDateString("en-GB", { month: "short" })}</text>`; }
  let tp = ""; for (let n = 0; n <= TOTALDAYS; n++) { const iso = addDays(IN.startDate, n); tp += (n ? "L" : "M") + x(iso).toFixed(1) + " " + y(targetOn(iso)).toFixed(1); }
  const ap = ws.map((w, i) => (i ? "L" : "M") + x(w.d).toFixed(1) + " " + y(avg7(w.d)).toFixed(1)).join("");
  const pts = ws.map(w => `<circle class="pt" cx="${x(w.d).toFixed(1)}" cy="${y(w.kg).toFixed(1)}" r="3.2"/>`).join("");
  const td = dayDiff(IN.startDate, todayIso) >= 0 && dayDiff(todayIso, IN.goalDate) >= 0 ? `<line class="today" x1="${x(todayIso)}" x2="${x(todayIso)}" y1="${T}" y2="${H - B}"/>` : "";
  const cps = CPS.map(c => `<circle class="cp" cx="${x(c.d)}" cy="${y(c.kg)}" r="4"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight against target"><rect x="0" y="0" width="${W}" height="${H}" fill="var(--surface)"/>${g}<path class="tgt" d="${tp}"/>${td}${cps}${ws.length > 1 ? `<path class="avg" d="${ap}"/>` : ""}${pts}</svg>`;
}
function weekRows() {
  const out = []; const ws = weightsSorted();
  for (let k = 1; k <= Math.ceil((TOTALDAYS + 1) / 7); k++) {
    const s = addDays(IN.startDate, 7 * (k - 1)), e = addDays(IN.startDate, 7 * k - 1);
    const inWk = ws.filter(w => w.d >= s && w.d <= e);
    if (dayDiff(todayIso, s) > 0 && !inWk.length) break;
    const a = inWk.length ? inWk.reduce((t, w) => t + w.kg, 0) / inWk.length : null;
    const tg = inWk.length ? inWk.reduce((t, w) => t + targetOn(w.d), 0) / inWk.length : targetOn(addDays(s, 3));
    const st = a == null ? ["No data", ""] : a <= tg + 0.3 ? ["On track", "good"] : a <= tg + 1 ? ["Slightly behind", "warn"] : ["Behind", "warn"];
    out.push({ k, s, e, a, tg, st });
  }
  return out;
}
function renderWeight() {
  if (!S.profile) { $("#v-weight").innerHTML = "<h1>Weight</h1>" + myPlanCard(); bindMyPlan(); return; }
  if (ALL()) { renderWeightAll(); return; }
  const ws = weightsSorted(); const last = ws[ws.length - 1];
  const a = last ? avg7(last.d) : null, tToday = targetOn(todayIso);
  const lost = a != null ? IN.start - a : 0;
  const status = a == null ? ["Add a weigh-in", ""] : a <= targetOn(last.d) + 0.3 ? ["On track", "good"] : a <= targetOn(last.d) + 1 ? ["Slightly behind", "warn"] : ["Behind \u2013 cut 150 kcal or add 2,000 steps", "warn"];
  const todays = ws.find(w => w.d === todayIso);
  const hist = [...ws].reverse().slice(0, 21).map(w => `<div class="li"><div class="grow"><div class="t num">${parseD(w.d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}</div><div class="s num">target ${fmt(targetOn(w.d), 1)} kg${w.steps ? " \u00b7 " + fmt(w.steps) + " steps" : ""}${w.note ? " \u00b7 " + esc(w.note) : ""}</div></div>
    <div class="r"><b class="num">${fmt(w.kg, 1)} kg</b></div><button class="btn ghost" data-del="${w.d}" aria-label="Delete ${w.d}">\u2715</button></div>`).join("");
  const wk = weekRows().map(r => `<tr><td class="num">${r.k}</td><td class="num">${parseD(r.s).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</td><td class="num">${fmt(r.tg, 1)}</td><td class="num">${r.a == null ? "\u2013" : fmt(r.a, 1)}</td><td>${r.st[0] === "No data" ? '<span class="muted">\u2013</span>' : `<span class="chip ${r.st[1]}">${r.st[0]}</span>`}</td></tr>`).join("");
  $("#v-weight").innerHTML = `<h1>Weight</h1>
    ${myPlanCard()}
    <form class="card stack" id="wform">
      <div class="row between"><h3>${todays ? "Update today's weigh-in" : "Add a weigh-in"}</h3><span class="small muted num">target today ${fmt(tToday, 1)} kg</span></div>
      <div class="form-grid">
        <label for="w-kg">Weight (kg)<input type="text" id="w-kg" inputmode="decimal" autocomplete="off" placeholder="${fmt(tToday, 1).replace(".", DEC)}" value="${todays ? String(todays.kg).replace(".", DEC) : ""}" required></label>
        <label for="w-date">Date<input type="date" id="w-date" value="${todayIso}" max="${todayIso}"></label>
        <label for="w-steps" style="grid-column:1/-1">Steps (optional)<input type="number" id="w-steps" inputmode="numeric" step="100" min="0" placeholder="e.g. 9,000" value="${todays && todays.steps ? todays.steps : ""}"></label>
      </div>
      <button class="btn primary" type="submit">Save weigh-in</button>
      <p class="small muted">Weigh in every morning after the toilet, before eating. Judge progress by the 7-day average \u2013 single days jump \u00b11 kg with water.</p>
    </form>
    <div class="kpis"><div class="kpi"><span class="eyebrow">7-day avg</span><b class="num">${a != null ? fmt(a, 1) + " kg" : "\u2013"}</b></div>
      <div class="kpi"><span class="eyebrow">Lost</span><b class="num">${fmt(lost, 1)} kg</b><span class="small muted">of ${fmt(IN.start - IN.goal, 0)} kg</span></div>
      <div class="kpi"><span class="eyebrow">Status</span><b style="font-size:.95rem"><span class="chip ${status[1]}">${status[0]}</span></b></div></div>
    <div class="card chart stack"><div class="row between"><h3>Weight vs target</h3><span class="small muted">dashed = target \u00b7 line = 7-day avg</span></div>${chartSvg()}
      <div class="row small muted">${CPS.map(c => `<span class="chip num">${parseD(c.d).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}: ${fmt(c.kg, 1)} kg</span>`).join("")}</div></div>
    <div class="card stack"><h3>Weekly check</h3><div class="tbl-wrap"><table class="wk"><thead><tr><th>Wk</th><th>From</th><th>Target</th><th>Avg</th><th>Status</th></tr></thead><tbody>${wk}</tbody></table></div>
      <p class="small muted">Flat for 2 weeks in a row? Cut 150 kcal (drop the snack's fruit or 20 g of rice) or add 2,000 steps a day \u2013 one change at a time.</p></div>
    <div class="stack"><h3>History</h3>${ws.length ? `<div class="list">${hist}</div>` : `<div class="empty">No weigh-ins yet. Add today's weight above.</div>`}</div>
    ${syncCardHtml()}
    <div class="card stack"><div class="row between"><h3>Backup</h3><button class="btn ghost" id="bk-toggle">${showBackup ? "Hide" : "Show"}</button></div>
      <p class="small muted">Weigh-ins, ticks and meal swaps are always saved in this browser${syncCfg().token ? " and synced to GitHub" : ""}. You can also copy a backup and paste it here to restore.</p>
      ${showBackup ? `<div class="row"><button class="btn" id="bk-copy">Copy backup</button><button class="btn" id="bk-restore">Restore from pasted text</button></div><textarea id="bk-text" rows="4" placeholder="Paste a backup here"></textarea>` : ""}</div>`;
  const v = $("#v-weight");
  $("#wform").onsubmit = e => { e.preventDefault(); const kg = parseFloat(String($("#w-kg").value).trim().replace(/\s/g, "").replace(",", "."));
    if (!(kg > 40 && kg < 200)) { toast("Enter your weight in kg, e.g. 81" + DEC + "4"); return; }
    const d = $("#w-date").value || todayIso; const steps = parseInt($("#w-steps").value, 10);
    S.weights = S.weights.filter(w => w.d !== d); S.weights.push({ d, kg: Math.round(kg * 10) / 10, u: Date.now(), ...(steps > 0 ? { steps } : {}) });
    save(); renderWeight(); renderStrip(); toast(saveOk ? "Saved" : "Not saved \u2013 this browser blocks storage"); };
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.weights = S.weights.filter(w => w.d !== b.dataset.del); S.weights.push({ d: b.dataset.del, del: true, u: Date.now() }); save(); renderWeight(); renderStrip(); toast("Deleted"); });
  $("#bk-toggle").onclick = () => { showBackup = !showBackup; renderWeight(); };
  bindSyncCard(); bindMyPlan();
  const bc = $("#bk-copy"); if (bc) bc.onclick = () => { const txt = JSON.stringify(S); const ta = $("#bk-text");
    navigator.clipboard && navigator.clipboard.writeText(txt).then(() => toast("Backup copied"), () => { ta.value = txt; ta.select(); toast("Select all and copy"); }) || (ta.value = txt, ta.select()); };
  const br = $("#bk-restore"); if (br) br.onclick = () => { try { const o = JSON.parse($("#bk-text").value);
    if (!o.plan || !o.weights) throw 0; S = { plan: o.plan, ticks: o.ticks || {}, weights: o.weights, planU: Date.now(), ticksU: Date.now(), planDefault: S.planDefault, planVer: S.planVer }; save(); renderWeight(); renderStrip(); toast("Restored"); }
    catch (e) { toast("That doesn't look like a backup"); } };
}

/* ---------- sync card (Weight tab) ---------- */
function syncCardHtml() {
  const c = syncCfg();
  const head = `<div class="row between"><h3>Sync across devices</h3>${c.token ? '<span class="chip good">On</span>' : '<span class="chip">Off</span>'}</div>`;
  const status = `<p id="sync-status" class="small ${syncState.err ? "warn-text" : "muted"}">${esc(syncState.msg)}</p>`;
  if (!CAN_SYNC) return `<div class="card stack">${head}<p class="small muted">Sync works on your GitHub Pages copy of this app (yourname.github.io/diet-plan). Here, your data stays on this device.</p></div>`;
  if (c.token) return `<div class="card stack">${head}
    <p class="small muted">Saving to your private repo <b>${esc(c.repo)}</b>. Weigh-ins, meal swaps and shopping ticks follow you to every device you connect.</p>
    ${status}
    <div class="row"><button class="btn primary" id="sy-now">Sync now</button><button class="btn ghost" id="sy-off">Disconnect this device</button></div></div>`;
  return `<div class="card stack">${head}
    <p class="small muted">Keep your data in a private GitHub repo so it follows you between phone and laptop. Without this, everything is saved on this device only.</p>
    <details><summary class="small" style="color:var(--accent);font-weight:700;cursor:pointer">One-time setup (3 min)</summary>
      <ol class="small" style="margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
        <li>Create a <b>private</b> repo: github.com/new &rarr; name <b>diet-data</b> &rarr; <b>Private</b> &rarr; tick <b>Add a README file</b> &rarr; Create repository.</li>
        <li>Create a token: github.com &rarr; your photo &rarr; Settings &rarr; Developer settings &rarr; Personal access tokens &rarr; <b>Fine-grained tokens</b> &rarr; Generate new token. Expiration: 1 year. Repository access: <b>Only select repositories &rarr; diet-data</b>. Permissions: <b>Contents &rarr; Read and write</b>. Generate it and copy it.</li>
        <li>Paste it below and tap Connect. Do the same on each device. Never put the token in the diet-plan repo or send it to anyone.</li>
      </ol></details>
    <label for="sy-repo" class="small muted" style="font-weight:700;display:flex;flex-direction:column;gap:4px">Private repo<input type="text" id="sy-repo" value="${esc(c.repo || DEFAULT_REPO)}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label for="sy-token" class="small muted" style="font-weight:700;display:flex;flex-direction:column;gap:4px">Token<input type="password" id="sy-token" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    ${status}
    <button class="btn primary" id="sy-connect">Connect</button></div>`;
}
function bindSyncCard() {
  const cn = $("#sy-connect");
  if (cn) cn.onclick = async () => {
    const repo = $("#sy-repo").value.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\/+$/, "");
    const token = $("#sy-token").value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { setSyncMsg("Enter the repo as username/repo, e.g. " + DEFAULT_REPO, true); return; }
    if (token.length < 20) { setSyncMsg("Paste the whole token - it starts with github_pat_", true); return; }
    setSyncMsg("Checking...");
    try { await ghGet({ repo, token }); }
    catch (e) { setSyncMsg(e && e.status ? ghError(e.status) : "No connection - try again.", true); return; }
    setSyncCfg({ repo, token }); setSyncMsg(""); renderWeight(); await syncNow(true);
  };
  const now = $("#sy-now"); if (now) now.onclick = () => syncNow(true);
  const off = $("#sy-off"); if (off) off.onclick = () => {
    const c = syncCfg(); setSyncCfg({ repo: c.repo }); syncState = { msg: "", err: false }; renderWeight(); toast("This device is disconnected");
  };
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });

/* ---------- boot ---------- */
if (S.profile) applyProfile();
renderStrip();
let startTab = "today"; try { startTab = localStorage.getItem(KEY + ".tab") || "today"; } catch (e) {}
if (!location.hash || /^#(setup|plans|edit-|copy-)/i.test(location.hash)) setHash(TABS.includes(startTab) ? startTab : "today", false);
try { route(); } catch (e) { console.error(e); }
if (!S.profile) go("plans");
syncNow();
</script>
