<style>
/* Layout: one-column phone app - sticky status strip, scrolling cards, fixed bottom tab bar (thumb reach). */
:root {
  --bg: #F2F5F3; --surface: #FFFFFF; --sunk: #E8EEEB; --ink: #14201C; --muted: #5A6A64; --line: #D8E1DD;
  --accent: #0A6B60; --accent-ink: #FFFFFF; --accent-soft: #DCEFEA;
  --good: #1D7A4C; --good-soft: #DDF1E5; --warn: #A6460C; --warn-soft: #FBE9DA; --target: #8A9A94;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 14px; --r-sm: 10px; --gutter: 16px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1412; --surface: #17201D; --sunk: #111917; --ink: #E4ECE9; --muted: #98AAA3; --line: #2A3732;
  --accent: #46C1B0; --accent-ink: #062521; --accent-soft: #15362F;
  --good: #5ACB8C; --good-soft: #163626; --warn: #F2A462; --warn-soft: #3B2617; --target: #6F807A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #17201D; --sunk: #111917; --ink: #E4ECE9; --muted: #98AAA3; --line: #2A3732;
  --accent: #46C1B0; --accent-ink: #062521; --accent-soft: #15362F;
  --good: #5ACB8C; --good-soft: #163626; --warn: #F2A462; --warn-soft: #3B2617; --target: #6F807A; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }   /* views/sheets toggle with el.hidden - must win over .view { display:flex } */
html, body { height: 100% }
body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
main { max-width: 560px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 8px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em }
h1 { font-size: 1.75rem; font-weight: 800 } h2 { font-size: 1.25rem; font-weight: 700 } h3 { font-size: 1.06rem; font-weight: 700 }
p { margin: 0 }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: .86rem }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: .9rem; min-height: 40px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { background: transparent }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font-size: .78rem; font-weight: 700; background: var(--sunk); color: var(--muted); white-space: nowrap }
.chip.good { background: var(--good-soft); color: var(--good) } .chip.warn { background: var(--warn-soft); color: var(--warn) } .chip.acc { background: var(--accent-soft); color: var(--accent) }

/* status strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); border-bottom: 1px solid var(--line) }
.strip .row { gap: 8px }
.strip b { font-family: var(--display); font-weight: 800 }

/* bottom tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px }
nav.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: .72rem; font-weight: 700 }
nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft) }

section.view { display: flex; flex-direction: column; gap: 14px; padding-top: 14px }

/* day chips */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px }
.days button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; min-height: 48px }
.days button span:first-child { font-weight: 700; font-size: .86rem }
.days button span:last-child { font-size: .68rem; color: var(--muted) }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.days button[aria-pressed="true"] span:last-child { color: var(--accent-ink); opacity: .85 }
.days button.today:not([aria-pressed="true"]) { border-color: var(--accent); }
.days button.office span:first-child::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-left: 3px; vertical-align: middle; opacity: .7 }

/* totals */
.total-big { font-family: var(--display); font-weight: 800; font-size: 2.4rem; line-height: 1 }
.bar { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; position: relative }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px }
.bar.over i { background: var(--warn) }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .5 }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.kpi { background: var(--sunk); border-radius: var(--r-sm); padding: 8px 10px; min-width: 0 }
.kpi b { display: block; font-family: var(--display); font-size: 1.15rem }

/* meal cards */
.meal { display: grid; gap: 6px }
.meal .slot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.meal .name { font-family: var(--display); font-weight: 700; font-size: 1.12rem; line-height: 1.2 }
.meal .cz { color: var(--muted); font-size: .88rem; font-style: italic }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .88rem; color: var(--muted) }
.meta b { color: var(--ink) }
.meal .actions { display: flex; gap: 8px; margin-top: 4px }
.drinks { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; border-radius: var(--r); border: 1px dashed var(--line); font-size: .9rem; color: var(--muted) }

/* lists */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.list > * + * { border-top: 1px solid var(--line) }
.li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: transparent; border: 0; text-align: left; width: 100%; min-width: 0 }
.li .grow { flex: 1; min-width: 0 }
.li .t { font-weight: 700 }
.li .s { font-size: .84rem; color: var(--muted) }
.li .r { text-align: right; flex-shrink: 0 }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 999px; padding: 4px; gap: 4px }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 8px 6px; font-weight: 700; font-size: .88rem; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .84rem; font-weight: 700; white-space: nowrap }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.warn-text { color: var(--warn) }
select { width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 0 12px; font: inherit; color: inherit }
.sw { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px }
.sw button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: .82rem; white-space: nowrap; cursor: pointer }
.sw button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.sw .sw-plans { background: transparent; color: var(--accent); border-style: dashed }
.btn[disabled] { opacity: .5; cursor: default }
input[type="text"], input[type="password"], input[type="search"], input[type="number"], input[type="date"], textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; min-height: 44px }
input[type="text"], input[type="number"], input[type="date"] { display: block; height: 46px; min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; text-align: left; line-height: normal }
input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0 }   /* iOS Safari centres the date and forces a min width */
input[type="date"]::-webkit-calendar-picker-indicator { margin-left: auto }

/* sheet (recipe / swap overlay) */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0 var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 32px) }
.sheet .bar-top { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 12px; border-bottom: 1px solid var(--line); margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter) }
.sheet .inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-top: 14px }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; cursor: pointer }
ol.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; font-size: 1.1rem; color: var(--accent); text-align: center }
ol.steps li.done { opacity: .5 } ol.steps li.done span { text-decoration: line-through }
ul.ing { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
ul.ing li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding-bottom: 6px; border-bottom: 1px dotted var(--line) }
ul.ing li small { display: block; color: var(--muted); font-style: italic }
ul.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px }

/* shopping */
.shop-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: start; padding: 12px 14px }
.shop-item input[type="checkbox"] { width: 26px; height: 26px; margin: 2px 0 0; accent-color: var(--accent) }
.shop-item.ticked .grow { opacity: .45 } .shop-item.ticked .grow .t { text-decoration: line-through }
.shop-item details summary { list-style: none; cursor: pointer; color: var(--accent); font-size: .8rem; font-weight: 700; margin-top: 4px }
.shop-item details summary::-webkit-details-marker { display: none }
.cat-h { padding: 10px 14px 6px; background: var(--sunk) }

/* weight */
.chart svg { width: 100%; height: auto; display: block }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .axis { fill: var(--muted); font: 11px var(--body) }
.chart .tgt { stroke: var(--target); stroke-width: 2; stroke-dasharray: 5 4; fill: none }
.chart .avg { stroke: var(--accent); stroke-width: 2.5; fill: none }
.chart .pt { fill: var(--accent); }
.chart .today { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 2 3 }
.chart .cp { fill: var(--surface); stroke: var(--target); stroke-width: 2 }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: .84rem; font-weight: 700; color: var(--muted); min-width: 0 }
table.wk { width: 100%; border-collapse: collapse; font-size: .88rem }
table.wk th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 4px }
table.wk td { padding: 7px 4px; border-top: 1px solid var(--line) }
.tbl-wrap { overflow-x: auto }
.empty { text-align: center; padding: 18px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; z-index: 30; font-size: .9rem }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); color: var(--warn); border-radius: var(--r-sm); padding: 10px 12px; font-weight: 700 }
.eo-table { width: 100%; border-collapse: collapse; font-size: .88rem }
.eo-table td, .eo-table th { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; text-align: left }
.eo-table th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 0 }
@media (prefers-reduced-motion: no-preference) { .btn, .days button, nav.tabs button { transition: background-color .15s, color .15s } }
</style>

","cz":"M\u00edchan\u00e1 vejce s ku\u0159ec\u00ed \u0161unkou","mins":8,"batch":false,"office":false,"anchor":112,"ing":[{"f":"F08","g":100,"d":"2 eggs","cz":"vejce"},{"f":"F09","g":50,"d":"50 g chicken ham (2\u20133 slices)","cz":"ku\u0159ec\u00ed \u0161unka"},{"f":"F19","g":60,"d":"60 g rye/wholegrain bread (1 large slice)","cz":"celozrnn\u00fd / \u017eitn\u00fd chl\u00e9b"},{"f":"F41","g":100,"d":"1 tomato (\u2248100 g)","cz":"raj\u010data"},{"f":"F40","g":80,"d":"80 g cucumber (\u00bc cucumber)","cz":"sal\u00e1tov\u00e1 okurka"}],"steps":["Whisk 2 eggs with \u215b tsp salt and a pinch of black pepper. Cut 50 g chicken ham (2\u20133 slices) into strips.","Heat the frying pan on low\u2013medium (2\u20133) for 2 min \u2013 no oil needed in a non-stick pan.","Pour in the eggs and stir slowly with the wooden spatula for 2\u20133 min until just set. Fold in the ham for the last 30 s and slide onto a plate.","Toast 1 large slice of rye bread (60 g) on setting 3\u20134. Slice 1 tomato (100 g) and 80 g cucumber on the side."],"tips":["Low heat gives creamy eggs without butter.","Plain '\u0161unka' is pork \u2013 pick 'ku\u0159ec\u00ed \u0161unka nejvy\u0161\u0161\u00ed jakosti' (chicken ham, \u226590% meat)."],"storage":"","note":"","equip":["Frying pan","Toaster"]},"B6":{"id":"B6","label":"B6 \u00b7 Tvaroh spread on rye bread","type":"Breakfast","en":"Tvaroh spread on rye bread","cz":"Tvarohov\u00e1 pomaz\u00e1nka na chlebu","mins":5,"batch":false,"office":true,"anchor":132,"ing":[{"f":"F19","g":80,"d":"80 g wholegrain/rye bread (2 slices)","cz":"celozrnn\u00fd / \u017eitn\u00fd chl\u00e9b"},{"f":"F11","g":250,"d":"250 g tvaroh (1 tub)","cz":"odtu\u010dn\u011bn\u00fd tvaroh"},{"f":"F41","g":80,"d":"80 g tomato","cz":"raj\u010data"},{"f":"F40","g":80,"d":"80 g cucumber","cz":"sal\u00e1tov\u00e1 okurka"}],"steps":["Mix 250 g tvaroh (1 tub) with 2\u20133 tbsp water or milk, \u00bc tsp salt, a pinch of black pepper and \u00bc tsp sweet paprika into a soft spread. Add a little finely chopped onion or chives if you like.","Toast 2 slices of bread (80 g) on setting 3\u20134, or leave them plain.","Spread the tvaroh thickly over both slices and top with 80 g sliced tomato and 80 g sliced cucumber."],"tips":["Tvarohov\u00e1 pomaz\u00e1nka keeps 2 days in a closed box \u2013 make it the night before and take bread and spread separately to the office."],"storage":"","note":"","equip":["Toaster"]},"B7":{"id":"B7","label":"B7 \u00b7 Oat & tvaroh pancakes with berries","type":"Breakfast","en":"Oat & tvaroh pancakes with berries","cz":"Ovesn\u00e9 l\u00edvance s tvarohem","mins":15,"batch":false,"office":false,"anchor":149,"ing":[{"f":"F18","g":40,"d":"40 g rolled oats","cz":"ovesn\u00e9 vlo\u010dky"},{"f":"F08","g":50,"d":"1 egg","cz":"vejce"},{"f":"F11","g":150,"d":"150 g low-fat tvaroh","cz":"odtu\u010dn\u011bn\u00fd tvaroh"},{"f":"F36","g":80,"d":"80 g frozen berries","cz":"mra\u017een\u00e9 lesn\u00ed ovoce"},{"f":"F31","g":3,"d":"3 g olive oil (brushed)","cz":"olivov\u00fd olej"},{"f":"F35","g":1,"d":"\u00bd tsp cinnamon + \u00bd tsp baking powder (optional)","cz":"sko\u0159ice, kyp\u0159ic\u00ed pr\u00e1\u0161ek"}],"steps":["Blitz 40 g oats to a coarse flour in a blender, or use them as they are.","In a bowl, mix the oats with 1 egg, 150 g tvaroh, \u00bd tsp cinnamon and \u00bd tsp baking powder into a thick batter. Add 1\u20132 tbsp water if it's too stiff to drop from a spoon.","Heat the frying pan on medium (3\u20134) for 2 min and brush it with 3 g oil (\u00bd tsp).","Drop in 4 heaped spoonfuls of batter, flatten them slightly and cook 2\u20133 min until golden underneath. Flip and cook 2 min more. The plate keeps getting hotter, so turn down to 2\u20133 after the first batch.","Microwave 80 g frozen berries at 750 W for 1 min and spoon them over as a sauce."],"tips":["Weekend favourite. Leftovers reheat in the microwave at 750 W for 30\u201340 s."],"storage":"Fridge 2 days.","note":"","equip":["Frying pan","Microwave"]},"B8":{"id":"B8","label":"B8 \u00b7 Veggie frittata + apple","type":"Breakfast","en":"Veggie frittata + apple","cz":"Zeleninov\u00e1 frittata + jablko","mins":15,"batch":true,"office":true,"anchor":171,"ing":[{"f":"F08","g":150,"d":"3 eggs","cz":"vejce"},{"f":"F42","g":50,"d":"50 g red pepper","cz":"\u010derven\u00e1 paprika"},{"f":"F43","g":20,"d":"20 g onion","cz":"cibule"},{"f":"F16","g":20,"d":"20 g Eidam 30%, grated","cz":"eidam 30 %"},{"f":"F37","g":150,"d":"1 apple (\u2248150 g)","cz":"jablko"}],"steps":["Finely dice 50 g red pepper and 20 g onion.","Put the frying pan on medium (3\u20134). Add the veg with 1 tbsp water (no oil) and cook 3\u20134 min, stirring, until soft and the water has gone.","Whisk 3 eggs with \u215b tsp salt, a pinch of black pepper and a pinch of dried oregano. Pour over the veg, spread it out and stir once.","Turn the hotplate to low (1\u20132). Cover the pan with a large plate or the pot lid and cook 5\u20136 min, until the edges are set and the middle is almost firm.","Scatter 20 g grated Eidam over, cover again and cook 2 min until the top is set and the cheese has melted.","Slide it onto a plate and eat it with 1 apple. For the office, let it cool, box it and eat it cold or warm it for 40 s at 750 W."],"tips":["No special tin needed. Add a handful of spinach or chopped chicken ham for variety."],"storage":"Fridge 4 days in a closed box \u2013 perfect grab-and-go for office days.","note":"","equip":["Frying pan + a large plate as a lid","Microwave (to reheat)"]},"L1":{"id":"L1","label":"L1 \u00b7 Chicken, rice & big salad","type":"Lunch","en":"Chicken, rice & big salad","cz":"Ku\u0159e s r\u00fd\u017e\u00ed a sal\u00e1tem","mins":25,"batch":true,"office":true,"anchor":193,"ing":[{"f":"F01","g":150,"d":"150 g chicken breast (raw weight)","cz":"ku\u0159ec\u00ed prsa"},{"f":"F20","g":70,"d":"70 g basmati rice (dry)","cz":"r\u00fd\u017ee basmati"},{"f":"F39","g":60,"d":"60 g salad mix","cz":"sal\u00e1tov\u00fd mix"},{"f":"F40","g":100,"d":"100 g cucumber","cz":"sal\u00e1tov\u00e1 okurka"},{"f":"F41","g":100,"d":"1 tomato (\u2248100 g)","cz":"raj\u010data"},{"f":"F31","g":5,"d":"5 g olive oil (1 tsp) + lemon or vinegar","cz":"olivov\u00fd olej"},{"f":"F35","g":1,"d":"\u00bc tsp salt, \u215b tsp black pepper, \u00bd tsp sweet paprika, \u00bc tsp garlic powder","cz":"s\u016fl, pep\u0159, sladk\u00e1 paprika, su\u0161en\u00fd \u010desnek"}],"steps":["Rice: boil the kettle. Rinse 70 g basmati in a sieve, put it in the small pot with 140 ml boiling water and a pinch of salt. Bring back to the boil on high, put the lid on, turn to low (1) and cook 12 min. Switch off and leave 5 min with the lid on.","Chicken: rub 150 g chicken breast with \u00bc tsp salt, \u215b tsp black pepper, \u00bd tsp sweet paprika and \u00bc tsp garlic powder. If it's thicker than 2 cm, slice it in half horizontally.","Air fryer: Air Fry, 200 \u00b0C, 12 min (no preheating). Turn the chicken after 6 min. It's done when the thickest part is white all through (74 \u00b0C). Rest 3 min, then slice.","Salad: chop 60 g salad mix, 100 g cucumber and 1 tomato (100 g). Dress with 5 g olive oil (1 tsp), 1 tsp lemon juice or vinegar and a pinch of salt.","Box it: rice + chicken + salad. Keep the dressing in a small separate pot if it's for the office."],"tips":["At the office, eat it cold or microwave the rice and chicken 1\u20131\u00bd min; keep the salad separate."],"storage":"Fridge 3\u20134 days.","note":"","equip":["Air fryer","Small pot + lid","Kettle"]},"L2":{"id":"L2","label":"L2 \u00b7 Salmon, potatoes & green beans","type":"Lunch","en":"Salmon, potatoes & green beans","cz":"Losos s brambory a zelen\u00fdmi fazolkami","mins":30,"batch":false,"office":false,"anchor":217,"ing":[{"f":"F06","g":130,"d":"130 g salmon fillet","cz":"losos"},{"f":"F21","g":250,"d":"250 g potatoes","cz":"brambory"},{"f":"F47","g":150,"d":"150 g frozen green beans","cz":"zelen\u00e9 fazolky (mra\u017een\u00e9)"},{"f":"F35","g":1,"d":"\u00bc tsp salt, pinch of black pepper, \u00bd tsp dried dill, 2 lemon slices","cz":"s\u016fl, pep\u0159, kopr, citron"}],"steps":["Potatoes: boil the kettle. Peel or scrub 250 g potatoes and cut them into 3 cm pieces. Put them in the small pot, cover with boiling water and add \u00bd tsp salt. Simmer on medium (3\u20134), lid tilted, for 15\u201318 min until a knife slides in.","Salmon: season 130 g salmon with \u00bc tsp salt, a pinch of black pepper and \u00bd tsp dried dill, and lay 2 lemon slices on top. If it's frozen, thaw it overnight in the fridge first.","Air fryer: salmon in skin-side down. Air Fry, 190 \u00b0C, 10 min \u2013 it's done when it flakes easily.","Green beans: put 150 g frozen beans in a microwave-safe bowl with 2 tbsp water, cover with a plate and microwave at 900 W for 4\u20135 min. Drain.","Plate the potatoes, beans and salmon and squeeze a lemon wedge over everything."],"tips":["Salmon is the most expensive option \u2013 frozen portions are cheaper.","Swap for frozen Alaska pollock (treska): Air Fry 190 \u00b0C, 12 min \u2013 about half the calories and cost."],"storage":"","note":"","equip":["Air fryer","Small pot + lid","Kettle","Microwave"]},"L3":{"id":"L3","label":"L3 \u00b7 Chicken \u0159\u00edzek, potatoes & cucumber salad","type":"Lunch","en":"Chicken \u0159\u00edzek, potatoes & cucumber salad","cz":"Ku\u0159ec\u00ed \u0159\u00edzek s brambory a okurkov\u00fdm sal\u00e1tem","mins":30,"batch":false,"office":true,"anchor":237,"ing":[{"f":"F01","g":150,"d":"150 g chicken breast, flattened to ~1 cm","cz":"ku\u0159ec\u00ed prsa"},{"f":"F18","g":15,"d":"15 g rolled oats, crushed (the crumb)","cz":"ovesn\u00e9 vlo\u010dky"},{"f":"F14","g":50,"d":"50 g plain yogurt (20 g to coat, 30 g for the salad)","cz":"b\u00edl\u00fd jogurt"},{"f":"F21","g":250,"d":"250 g potatoes","cz":"brambory"},{"f":"F40","g":150,"d":"150 g cucumber","cz":"sal\u00e1tov\u00e1 okurka"},{"f":"F31","g":4,"d":"4 g oil (brush the tray and crust)","cz":"olivov\u00fd olej"},{"f":"F35","g":2,"d":"\u00bd tsp sweet paprika, \u00bc tsp salt, \u215b tsp black pepper, \u00bc tsp dried dill","cz":"sladk\u00e1 paprika, s\u016fl, pep\u0159, kopr"},{"f":"F44","g":2,"d":"\u00bd garlic clove (for the salad)","cz":"\u010desnek"}],"steps":["Potatoes: boil the kettle. Cut 250 g potatoes into 3 cm pieces, cover with boiling water in the small pot, add \u00bd tsp salt and simmer on medium (3\u20134), lid tilted, 15\u201318 min. Drain.","Flatten 150 g chicken breast to about 1 cm between two layers of cling film (or inside a freezer bag), tapping it with the bottom of the pot. Season both sides with \u00bc tsp salt, \u215b tsp black pepper and \u00bd tsp sweet paprika.","Crush 15 g oats (2 tbsp) in a bag with the pot or your hands. Spread 20 g yogurt over both sides of the chicken, then press it into the oats.","Air fryer: brush the basket with a little of the 4 g oil, lay the \u0159\u00edzek in and brush the top with the rest. Air Fry, 200 \u00b0C, 12 min, turning after 7 min. Press Crispy finish for the last 2 min for extra crunch.","Cucumber salad: slice 150 g cucumber thinly. Mix with the remaining 30 g yogurt, \u00bd crushed garlic clove, \u00bc tsp dried dill and a pinch of salt. Serve with the potatoes."],"tips":["A fried \u0159\u00edzek with potato salad is ~1,100 kcal; this version is about 500.","Cold \u0159\u00edzek is a Czech classic \u2013 fine to eat cold at the office. Freeze extra coated breasts raw and Air Fry them from frozen at 200 \u00b0C for 16\u201318 min."],"storage":"","note":"","equip":["Air fryer","Small pot + lid","Kettle"]},"L4":{"id":"L4","label":"L4 \u00b7 Chicken burrito bowl","type":"Lunch","en":"Chicken burrito bowl","cz":"Burrito miska s ku\u0159etem","mins":25,"batch":true,"office":true,"anchor":261,"ing":[{"f":"F01","g":150,"d":"150 g chicken breast","cz":"ku\u0159ec\u00ed prsa"},{"f":"F20","g":50,"d":"50 g basmati rice (dry)","cz":"r\u00fd\u017ee basmati"},{"f":"F26","g":80,"d":"80 g kidney beans (drained)","cz":"\u010derven\u00e9 fazole (konzerva)"},{"f":"F27","g":50,"d":"50 g sweetcorn (drained)","cz":"kuku\u0159ice (konzerva)"},{"f":"F33","g":80,"d":"80 g chopped tomatoes","cz":"kr\u00e1jen\u00e1 raj\u010data (konzerva)"},{"f":"F43","g":30,"d":"30 g onion","cz":"cibule"},{"f":"F42","g":50,"d":"50 g red pepper","cz":"\u010derven\u00e1 paprika"},{"f":"F14","g":50,"d":"50 g plain yogurt","cz":"b\u00edl\u00fd jogurt"},{"f":"F35","g":2,"d":"\u00bd tsp cumin, \u00bd tsp sweet paprika, \u00bc tsp chilli flakes, \u00bc tsp salt, 1 tsp lime or lemon juice","cz":"\u0159\u00edmsk\u00fd km\u00edn, sladk\u00e1 paprika, chilli, s\u016fl, limetka, citron"}],"steps":["Rice: rinse 50 g basmati and cook it with 100 ml boiling water and a pinch of salt in the small pot \u2013 boil on high, lid on, low (1) for 12 min, then rest 5 min.","Cut 150 g chicken into 2 cm cubes and toss with \u00bd tsp cumin, \u00bd tsp sweet paprika, \u00bc tsp chilli flakes and \u00bc tsp salt.","Heat the frying pan on high (5\u20136) for 2 min (no oil needed in non-stick). Cook the chicken 5\u20136 min, turning, until white all through.","Turn to medium (3\u20134). Add 30 g diced onion and 50 g diced red pepper for 2 min, then 80 g drained kidney beans and 80 g chopped tomatoes. Simmer 3 min.","Bowl or box: rice, the chicken and bean mix and 50 g sweetcorn. Top with 50 g yogurt and 1 tsp lime or lemon juice."],"tips":["Yogurt instead of sour cream saves ~80 kcal.","Office: pack the yogurt separately, microwave the bowl 1\u00bd\u20132 min, then add the yogurt."],"storage":"Fridge 3 days.","note":"","equip":["Frying pan","Small pot + lid","Kettle"]},"L5":{"id":"L5","label":"L5 \u00b7 Tuna pasta salad","type":"Lunch","en":"Tuna pasta salad","cz":"T\u011bstovinov\u00fd sal\u00e1t s tu\u0148\u00e1kem","mins":15,"batch":true,"office":true,"anchor":287,"ing":[{"f":"F22","g":70,"d":"70 g wholegrain pasta (dry)","cz":"celozrnn\u00e9 t\u011bstoviny"},{"f":"F07","g":120,"d":"1 can tuna in own juice (\u2248120 g drained)","cz":"tu\u0148\u00e1k ve vlastn\u00ed \u0161\u0165\u00e1v\u011b"},{"f":"F27","g":50,"d":"50 g sweetcorn","cz":"kuku\u0159ice (konzerva)"},{"f":"F40","g":100,"d":"100 g cucumber","cz":"sal\u00e1tov\u00e1 okurka"},{"f":"F41","g":100,"d":"100 g (cherry) tomatoes","cz":"raj\u010data"},{"f":"F14","g":50,"d":"50 g plain yogurt","cz":"b\u00edl\u00fd jogurt"},{"f":"F31","g":5,"d":"5 g olive oil (1 tsp)","cz":"olivov\u00fd olej"},{"f":"F35","g":1,"d":"1 tsp lemon juice, \u00bc tsp salt, pinch of black pepper, \u00bd tsp dried dill (or chives)","cz":"citron, s\u016fl, pep\u0159, kopr, pa\u017eitka"}],"steps":["Boil 1 l water in the kettle and pour it into the small pot on high. Add 1 tsp salt and 70 g pasta and cook as the pack says (usually 10\u201312 min). Drain and rinse with cold water.","Dressing: mix 50 g yogurt, 5 g olive oil (1 tsp), 1 tsp lemon juice, \u00bc tsp salt, a pinch of black pepper and \u00bd tsp dried dill.","Mix the pasta with 1 can drained tuna (120 g), 50 g sweetcorn, 100 g diced cucumber and 100 g halved cherry tomatoes, then fold in the dressing."],"tips":["Buy tuna 've vlastn\u00ed \u0161\u0165\u00e1v\u011b' (own juice), not 'v oleji' (oil) \u2013 ~100 kcal less per can.","No microwave needed \u2013 ideal office lunch."],"storage":"Fridge 2 days.","note":"","equip":["Small pot","Kettle"]},"L6":{"id":"L6","label":"L6 \u00b7 Chicken & red lentil soup","type":"Lunch","en":"Chicken & red lentil soup","cz":"\u010co\u010dkov\u00e1 pol\u00e9vka s ku\u0159etem","mins":40,"batch":true,"office":true,"anchor":310,"ing":[{"f":"F25","g":50,"d":"50 g red lentils (dry)","cz":"\u010derven\u00e1 \u010do\u010dka"},{"f":"F01","g":120,"d":"120 g chicken breast","cz":"ku\u0159ec\u00ed prsa"},{"f":"F45","g":100,"d":"100 g carrot","cz":"mrkev"},{"f":"F43","g":60,"d":"60 g onion","cz":"cibule"},{"f":"F44","g":5,"d":"1\u20132 garlic cloves","cz":"\u010desnek"},{"f":"F33","g":100,"d":"100 g chopped tomatoes","cz":"kr\u00e1jen\u00e1 raj\u010data (konzerva)"},{"f":"F31","g":5,"d":"5 g olive oil (1 tsp)","cz":"olivov\u00fd olej"},{"f":"F19","g":40,"d":"40 g bread (1 slice) on the side","cz":"celozrnn\u00fd / \u017eitn\u00fd chl\u00e9b"},{"f":"F35","g":1,"d":"\u00bd tsp cumin, \u00bd tsp sweet paprika, \u00bd bay leaf, \u2153 tsp salt; 350 ml water","cz":"\u0159\u00edmsk\u00fd km\u00edn, sladk\u00e1 paprika, bobkov\u00fd list, s\u016fl, voda"}],"steps":["Dice 60 g onion, 100 g carrot and 1\u20132 garlic cloves. Cut 120 g chicken breast into 2 cm cubes.","Heat 5 g olive oil (1 tsp) in the small pot on medium (3\u20134). Cook the onion, carrot and garlic 5 min, stirring.","Stir in \u00bd tsp cumin and \u00bd tsp sweet paprika for 30 s.","Add 50 g rinsed red lentils, 100 g chopped tomatoes, 350 ml boiling water from the kettle, \u00bd bay leaf and \u2153 tsp salt. Bring to the boil on high.","Add the chicken, tilt the lid on, turn to low\u2013medium (2\u20133) and simmer 20 min, stirring now and then, until the lentils fall apart. Add a splash of water if it gets too thick.","Take out the bay leaf, taste for salt and add a squeeze of lemon. Serve with 40 g bread (1 slice) on the side."],"tips":["Office: microwave 2\u20133 min, stirring halfway; take the bread separately."],"storage":"Fridge 4 days, freezer 3 months.","note":"","equip":["Small pot + lid","Kettle"]},"L7":{"id":"L7","label":"L7 \u00b7 Chicken & cheese wrap + apple","type":"Lunch","en":"Chicken & cheese wrap + apple","cz":"Ku\u0159ec\u00ed wrap + jablko","mins":15,"batch":false,"office":true,"anchor":337,"ing":[{"f":"F23","g":60,"d":"1 wholegrain tortilla (\u224860 g)","cz":"celozrnn\u00e1 tortilla"},{"f":"F01","g":130,"d":"130 g chicken breast","cz":"ku\u0159ec\u00ed prsa"},{"f":"F16","g":20,"d":"20 g Eidam 30%, grated","cz":"eidam 30 %"},{"f":"F39","g":30,"d":"30 g salad leaves","cz":"sal\u00e1tov\u00fd mix"},{"f":"F41","g":60,"d":"60 g tomato","cz":"raj\u010data"},{"f":"F40","g":60,"d":"60 g cucumber","cz":"sal\u00e1tov\u00e1 okurka"},{"f":"F14","g":40,"d":"40 g plain yogurt (for the sauce)","cz":"b\u00edl\u00fd jogurt"},{"f":"F44","g":2,"d":"\u00bd garlic clove","cz":"\u010desnek"},{"f":"F37","g":150,"d":"1 apple","cz":"jablko"}],"steps":["Cut 130 g chicken into strips and season with \u00bc tsp salt, a pinch of black pepper and \u00bd tsp sweet paprika \u2013 or use chicken cooked on Sunday.","Cook in the frying pan on high (5\u20136), no oil, 5\u20136 min, turning, until white all through. Air fryer option: Air Fry 200 \u00b0C, 8 min, shaking halfway.","Sauce: mix 40 g yogurt with \u00bd crushed garlic clove and a pinch of salt.","Warm 1 tortilla in the dry frying pan, 20 s per side. Spread the sauce over it and add 30 g salad leaves, 60 g sliced tomato, 60 g cucumber sticks, the chicken and 20 g grated Eidam.","Fold in the sides, roll tightly and cut in half. Pack with 1 apple."],"tips":["Wrap it in foil for the office.","Check the tortilla label: ~170\u2013180 kcal per wrap is normal; 'XXL' wraps can be 250+."],"storage":"","note":"","equip":["Frying pan (or air fryer)"]},"L8":{"id":"L8","label":"L8 \u00b7 Weekday lunch menu \u2013 eating out","type":"Lunch","en":"Weekday lunch menu \u2013 eating out","cz":"Poledn\u00ed menu (restaurace / kant\u00fdna)","mins":0,"batch":false,"office":true,"anchor":362,"ing":[{"f":"X01","g":100,"d":"1 restaurant lunch following the ordering rules","cz":""}],"steps":["Pick 'grilovan\u00fd / pe\u010den\u00fd / du\u0161en\u00fd' (grilled / roasted / stewed) meat or fish.","Side: 'va\u0159en\u00e9 brambory' (boiled potatoes) or rice + a salad. Skip knedl\u00edky, hranolky and cream sauces.","If soup is included, choose 'v\u00fdvar' (clear broth) over cream soups.","Ask: 'Mohl bych m\u00edsto knedl\u00edk\u016f va\u0159en\u00e9 brambory?' (Could I have boiled potatoes instead of dumplings?)","Big portion? Leave about a quarter of the side dish."],"tips":["See the 'Eating Out' sheet for good and bad dishes and their calories.","Many Czech dishes are pork ('vep\u0159ov\u00e9') \u2013 look for 'ku\u0159ec\u00ed' (chicken) or 'hov\u011bz\u00ed' (beef) in the name. Pluxee vouchers cover part of the cost."],"storage":"","note":"No cooking \u2013 ordering guide","equip":[]},"S1":{"id":"S1","label":"S1 \u00b7 Tvaroh dip with cucumber","type":"Snack","en":"Tvaroh dip with cucumber","cz":"Tvarohov\u00fd dip s okurkou","mins":2,"batch":false,"office":true,"anchor":379,"ing":[{"f":"F11","g":250,"d":"250 g tvaroh (1 tub)","cz":"odtu\u010dn\u011bn\u00fd tvaroh"},{"f":"F40","g":100,"d":"100 g cucumber","cz":"sal\u00e1tov\u00e1 okurka"}],"steps":["Whisk 250 g tvaroh (1 tub) with 2\u20133 tbsp water or milk, a pinch of salt, a pinch of black pepper and \u00bc tsp sweet paprika (or chopped chives) until creamy. Slice 100 g cucumber and use it to dip or spread."],"tips":["27 g protein for under 180 kcal \u2013 one of the best snacks you can buy in a Czech supermarket."],"storage":"","note":"","equip":[]},"S2":{"id":"S2","label":"S2 \u00b7 2 boiled eggs & an apple","type":"Snack","en":"2 boiled eggs & an apple","cz":"2 vejce natvrdo + jablko","mins":10,"batch":true,"office":true,"anchor":392,"ing":[{"f":"F08","g":100,"d":"2 eggs","cz":"vejce"},{"f":"F37","g":150,"d":"1 apple","cz":"jablko"}],"steps":["Boil the kettle. Lower 2 eggs into the small pot, cover with the boiling water and simmer on medium (3\u20134) for 9 min.","Cool in cold water for 2 min, peel, add a pinch of salt and eat with 1 apple."],"tips":[],"storage":"Boiled eggs keep 5 days in the fridge.","note":"","equip":["Small pot","Kettle"]},"S3":{"id":"S3","label":"S3 \u00b7 High-protein pudding","type":"Snack","en":"High-protein pudding","cz":"Proteinov\u00fd pudink","mins":0,"batch":false,"office":true,"anchor":407,"ing":[{"f":"F15","g":200,"d":"1 pot (200 g)","cz":"proteinov\u00fd pudink"}],"steps":["Ready to eat \u2013 keep 2\u20133 pots in the fridge."],"tips":["Label check: \u226515 g protein and \u2264170 kcal per pot."],"storage":"","note":"No cooking  \u00b7  office-friendly","equip":[]},"S4":{"id":"S4","label":"S4 \u00b7 Skyr with berries","type":"Snack","en":"Skyr with berries","cz":"Skyr s lesn\u00edm ovocem","mins":2,"batch":false,"office":true,"anchor":419,"ing":[{"f":"F10","g":150,"d":"150 g plain skyr","cz":"skyr (b\u00edl\u00fd)"},{"f":"F36","g":80,"d":"80 g frozen berries (thawed)","cz":"mra\u017een\u00e9 lesn\u00ed ovoce"}],"steps":["Microwave 80 g frozen berries at 750 W for 40 s (or thaw them overnight in the fridge) and stir into 150 g skyr."],"tips":["Add cinnamon or a few drops of vanilla for sweetness without sugar."],"storage":"","note":"","equip":["Microwave (optional)"]},"S5":{"id":"S5","label":"S5 \u00b7 Tvaroh-banana cream","type":"Snack","en":"Tvaroh-banana cream","cz":"Tvarohov\u00fd kr\u00e9m s ban\u00e1nem","mins":3,"batch":false,"office":true,"anchor":432,"ing":[{"f":"F11","g":150,"d":"150 g low-fat tvaroh","cz":"odtu\u010dn\u011bn\u00fd tvaroh"},{"f":"F38","g":60,"d":"\u00bd banana (\u224860 g)","cz":"ban\u00e1n"},{"f":"F35","g":1,"d":"pinch of cinnamon","cz":"sko\u0159ice"}],"steps":["Mash \u00bd banana (60 g) with a fork, whisk it into 150 g tvaroh with 1\u20132 tbsp milk and dust with a pinch of cinnamon."],"tips":["Tastes like dessert; ~17 g protein."],"storage":"","note":"","equip":[]},"S6":{"id":"S6","label":"S6 \u00b7 Chicken ham & rye bread","type":"Snack","en":"Chicken ham & rye bread","cz":"Ku\u0159ec\u00ed \u0161unka se \u017eitn\u00fdm chlebem","mins":2,"batch":false,"office":true,"anchor":446,"ing":[{"f":"F09","g":60,"d":"60 g chicken ham","cz":"ku\u0159ec\u00ed \u0161unka"},{"f":"F19","g":40,"d":"40 g rye bread (1 slice)","cz":"celozrnn\u00fd / \u017eitn\u00fd chl\u00e9b"},{"f":"F40","g":60,"d":"60 g cucumber","cz":"sal\u00e1tov\u00e1 okurka"}],"steps":["Toast 1 slice of rye bread (40 g) on setting 3 if you like, and top it with 60 g chicken ham and 60 g sliced cucumber. Add \u00bd tsp mustard if you like (almost 0 kcal)."],"tips":["Much better than a bakery kol\u00e1\u010d (~350\u2013450 kcal)."],"storage":"","note":"","equip":["Toaster (optional)"]},"S7":{"id":"S7","label" ,"g":3,"d":"1\u00bd tsp curry powder, \u00bc tsp cumin, pinch of chilli, \u00bc tsp salt","cz":"kari, \u0159\u00edmsk\u00fd km\u00edn, chilli, s\u016fl"},{"f":"F31","g":5,"d":"5 g olive oil (1 tsp)","cz":"olivov\u00fd olej"},{"f":"F20","g":50,"d":"50 g basmati rice (dry)","cz":"r\u00fd\u017ee basmati"}],"steps":["Rice: rinse 50 g basmati and cook with 100 ml boiling water and a pinch of salt in the small pot \u2013 boil on high, lid on, low (1) for 12 min, then rest 5 min.","Heat 5 g oil (1 tsp) in the frying pan on medium (3\u20134). Fry 80 g finely diced onion for 5 min until soft, then add 1 crushed garlic clove for 1 min.","Stir in 1\u00bd tsp curry powder, \u00bc tsp cumin and a pinch of chilli for 30 s.","Add 150 g chicken in 2 cm cubes and \u00bc tsp salt and cook 3\u20134 min until white all over.","Pour in 150 g chopped tomatoes and 50 ml water, turn to low\u2013medium (2\u20133) and simmer 10 min.","Take the pan off the hotplate and stir in 60 g yogurt (boiling makes it split). Serve with the rice."],"tips":["Yogurt instead of cream or coconut milk saves ~150\u2013200 kcal."],"storage":"Fridge 3 days, freezer 3 months.","note":"","equip":["Frying pan","Small pot + lid","Kettle"]},"D2":{"id":"D2","label":"D2 \u00b7 Beef chilli con carne (no rice)","type":"Dinner","en":"Beef chilli con carne (no rice)","cz":"Hov\u011bz\u00ed chilli con carne","mins":35,"batch":true,"office":true,"anchor":513,"ing":[{"f":"F03","g":130,"d":"130 g lean beef mince (<10% fat)","cz":"hov\u011bz\u00ed mlet\u00e9 maso (do 10 % tuku)"},{"f":"F26","g":120,"d":"120 g kidney beans (drained)","cz":"\u010derven\u00e9 fazole (konzerva)"},{"f":"F33","g":200,"d":"200 g chopped tomatoes","cz":"kr\u00e1jen\u00e1 raj\u010data (konzerva)"},{"f":"F43","g":60,"d":"60 g onion","cz":"cibule"},{"f":"F42","g":80,"d":"80 g red pepper","cz":"\u010derven\u00e1 paprika"},{"f":"F44","g":5,"d":"1\u20132 garlic cloves","cz":"\u010desnek"},{"f":"F34","g":15,"d":"15 g tomato paste (1 tbsp)","cz":"raj\u010datov\u00fd protlak"},{"f":"F35","g":3,"d":"\u00bd tsp cumin, 1 tsp sweet paprika, \u00bc tsp chilli flakes, \u00bd tsp dried oregano, \u00bc tsp salt","cz":"\u0159\u00edmsk\u00fd km\u00edn, sladk\u00e1 paprika, chilli, oregano, s\u016fl"},{"f":"F31","g":5,"d":"5 g olive oil (1 tsp)","cz":"olivov\u00fd olej"}],"steps":["Dice 60 g onion and 80 g red pepper, and crush 1 garlic clove.","Heat 5 g oil (1 tsp) in the frying pan on medium\u2013high (4\u20135). Soften the onion and pepper for 5 min, then add the garlic for 1 min.","Add 130 g lean beef mince, break it up with the spatula and brown it for 5 min.","Stir in 15 g tomato paste (1 tbsp), \u00bd tsp cumin, 1 tsp sweet paprika, \u00bc tsp chilli flakes, \u00bd tsp dried oregano and \u00bc tsp salt for 1 min.","Add 200 g chopped tomatoes, 120 g drained kidney beans and 100 ml water. Turn to low\u2013medium (2\u20133) and simmer 15\u201320 min until thick. Optional: 1 tbsp yogurt on top."],"tips":["No rice needed \u2013 the beans supply the carbs. Even better on day 2.","Buy mince labelled 'do 10 % tuku' (under 10% fat); standard mince has ~45% more calories. Chicken mince (ku\u0159ec\u00ed mlet\u00e9) works too."],"storage":"Fridge 3 days, freezer 3 months.","note":"","equip":["Frying pan"]},"D3":{"id":"D3","label":"D3 \u00b7 Salmon with roasted peppers & potatoes","type":"Dinner","en":"Salmon with roasted peppers & potatoes","cz":"Losos s pe\u010denou paprikou a brambory","mins":25,"batch":false,"office":false,"anchor":539,"ing":[{"f":"F06","g":130,"d":"130 g salmon fillet","cz":"losos"},{"f":"F42","g":200,"d":"200 g red pepper (1 large)","cz":"\u010derven\u00e1 paprika"},{"f":"F21","g":180,"d":"180 g potatoes","cz":"brambory"},{"f":"F35","g":1,"d":"\u00bd tsp salt, \u00bd tsp sweet paprika, \u00bc tsp garlic powder, pinch of black pepper, \u00bd tsp dried dill, 2 lemon slices","cz":"s\u016fl, sladk\u00e1 paprika, su\u0161en\u00fd \u010desnek, pep\u0159, kopr, citron"}],"steps":["Cut 180 g potatoes into 2 cm cubes. Toss them with \u00bc tsp salt, \u00bd tsp sweet paprika, \u00bc tsp garlic powder and 1 tsp water (no oil needed).","Air fryer: Air Fry, 200 \u00b0C, 10 min, shaking the basket after 5 min.","Meanwhile cut 200 g red pepper (1 large) into 3 cm strips. Season 130 g salmon with \u00bc tsp salt, a pinch of black pepper and \u00bd tsp dried dill, and lay 2 lemon slices on top.","Push the potatoes to one side, add the pepper strips and lay the salmon skin-side down next to them. Air Fry, 190 \u00b0C, 10\u201312 min more, until the salmon flakes and the pepper edges start to char."],"tips":["Salmon has its own fat \u2013 no oil needed.","No peppers? Courgette (cuketa) or cauliflower (kv\u011bt\u00e1k) in 3 cm pieces work the same way. Frozen Alaska pollock (treska) instead of salmon saves money and calories \u2013 same timings."],"storage":"","note":"","equip":["Air fryer"]},"D4":{"id":"D4","label":"D4 \u00b7 Chicken & vegetable stir-fry with rice","type":"Dinner","en":"Chicken & vegetable stir-fry with rice","cz":"Ku\u0159ec\u00ed wok se zeleninou","mins":20,"batch":false,"office":false,"anchor":558,"ing":[{"f":"F01","g":150,"d":"150 g chicken breast","cz":"ku\u0159ec\u00ed prsa"},{"f":"F48","g":250,"d":"250 g frozen stir-fry vegetables","cz":"zeleninov\u00e1 sm\u011bs na wok (mra\u017een\u00e1)"},{"f":"F32","g":15,"d":"15 ml soy sauce (1 tbsp)","cz":"s\u00f3jov\u00e1 om\u00e1\u010dka"},{"f":"F44","g":5,"d":"1\u20132 garlic cloves (+ ginger if you have it)","cz":"\u010desnek"},{"f":"F31","g":5,"d":"5 g oil (1 tsp)","cz":"olivov\u00fd olej"},{"f":"F20","g":45,"d":"45 g basmati rice (dry)","cz":"r\u00fd\u017ee basmati"}],"steps":["Rice: rinse 45 g basmati and cook with 90 ml boiling water and a pinch of salt in the small pot \u2013 boil, lid on, low (1) for 12 min, then rest 5 min.","Slice 150 g chicken into thin strips. Heat 5 g oil (1 tsp) in the frying pan on high (6) for 2 min and stir-fry the chicken 4\u20135 min until white through. Tip it onto a plate.","Put 250 g frozen stir-fry veg straight into the hot pan (still on high) and stir-fry 5\u20136 min.","Add 1 crushed garlic clove, put the chicken back, pour in 15 ml soy sauce (1 tbsp) and toss for 1 min. No extra salt \u2013 the soy sauce is salty."],"tips":["High heat and a pan that isn't overcrowded = crisp, not soggy, veg.","Chilli flakes add flavour for almost no calories."],"storage":"","note":"","equip":["Frying pan","Small pot + lid","Kettle"]},"D5":{"id":"D5","label":"D5 \u00b7 Tuna & egg salad","type":"Dinner","en":"Tuna & egg salad","cz":"Sal\u00e1t s tu\u0148\u00e1kem a vejcem","mins":15,"batch":false,"office":true,"anchor":579,"ing":[{"f":"F08","g":100,"d":"2 eggs","cz":"vejce"},{"f":"F07","g":120,"d":"1 can tuna in own juice (\u2248120 g drained)","cz":"tu\u0148\u00e1k ve vlastn\u00ed \u0161\u0165\u00e1v\u011b"},{"f":"F39","g":80,"d":"80 g salad mix","cz":"sal\u00e1tov\u00fd mix"},{"f":"F40","g":100,"d":"100 g cucumber","cz":"sal\u00e1tov\u00e1 okurka"},{"f":"F41","g":100,"d":"1 tomato (\u2248100 g)","cz":"raj\u010data"},{"f":"F27","g":40,"d":"40 g sweetcorn","cz":"kuku\u0159ice (konzerva)"},{"f":"F31","g":5,"d":"5 g olive oil (1 tsp) + lemon/vinegar, \u00bd tsp mustard","cz":"olivov\u00fd olej"},{"f":"F19","g":40,"d":"40 g bread (1 slice)","cz":"celozrnn\u00fd / \u017eitn\u00fd chl\u00e9b"}],"steps":["Boil the kettle and simmer 2 eggs in the small pot on medium (3\u20134) for 9 min. Cool in cold water, peel and quarter.","Toss 80 g salad mix, 100 g sliced cucumber, 1 tomato (100 g) in wedges and 40 g sweetcorn in a bowl.","Dressing: whisk 5 g olive oil (1 tsp), 1 tsp lemon juice or vinegar, \u00bd tsp mustard and a pinch each of salt and black pepper. Toss it with the salad.","Top with 1 can drained tuna (120 g) and the eggs. Toast 1 slice of bread (40 g) on setting 3\u20134."],"tips":["Use eggs boiled on Sunday and this takes 5 minutes."],"storage":"","note":"","equip":["Small pot","Kettle","Toaster"]},"D6":{"id":"D6","label":"D6 \u00b7 Chicken paprikash with rice","type":"Dinner","en":"Chicken paprikash with rice","cz":"Ku\u0159e na paprice s r\u00fd\u017e\u00ed","mins":30,"batch":false,"office":false,"anchor":601,"ing":[{"f":"F01","g":150,"d":"150 g chicken breast (or boneless thigh)","cz":"ku\u0159ec\u00ed prsa"},{"f":"F43","g":80,"d":"80 g onion","cz":"cibule"},{"f":"F35","g":4,"d":"1 tbsp sweet paprika (\u22484 g), pinch of caraway, \u00bc tsp salt, pinch of black pepper","cz":"sladk\u00e1 paprika, km\u00edn, s\u016fl, pep\u0159"},{"f":"F14","g":80,"d":"80 g plain yogurt (instead of cream)","cz":"b\u00edl\u00fd jogurt"},{"f":"F31","g":5,"d":"5 g oil (1 tsp)","cz":"olivov\u00fd olej"},{"f":"F20","g":55,"d":"55 g basmati rice (dry)","cz":"r\u00fd\u017ee basmati"}],"steps":["Rice: rinse 55 g basmati and cook with 110 ml boiling water and a pinch of salt in the small pot \u2013 boil, lid on, low (1) for 12 min, then rest 5 min.","Heat 5 g oil (1 tsp) in the frying pan on medium (3\u20134). Fry 80 g finely diced onion 6\u20138 min until soft and golden.","Add 150 g chicken in 2 cm cubes, \u00bc tsp salt and a pinch of black pepper and cook 3\u20134 min.","Lift the pan off the hotplate and stir in 1 tbsp sweet paprika (4 g) and a pinch of caraway \u2013 paprika burns on high heat. Add 100 ml water, put it back on low (2), cover with a plate and simmer 10 min.","Off the hotplate, stir in 80 g yogurt (don't boil it again or it splits). Serve with the rice."],"tips":["Classic ku\u0159e na paprice uses cream; yogurt saves ~200 kcal and adds protein.","Boneless chicken thigh (ku\u0159ec\u00ed stehenn\u00ed \u0159\u00edzky) is juicier \u2013 about +40 kcal per portion."],"storage":"","note":"","equip":["Frying pan + a plate as a lid","Small pot + lid","Kettle"]},"D7":{"id":"D7","label":"D7 \u00b7 Lean beef goulash with potatoes","type":"Dinner","en":"Lean beef goulash with potatoes","cz":"Hov\u011bz\u00ed gul\u00e1\u0161 s brambory","mins":105,"batch":true,"office":false,"anchor":623,"ing":[{"f":"F05","g":150,"d":"150 g lean beef","cz":"hov\u011bz\u00ed kli\u017eka"},{"f":"F43","g":120,"d":"120 g onion","cz":"cibule"},{"f":"F34","g":20,"d":"20 g tomato paste","cz":"raj\u010datov\u00fd protlak"},{"f":"F35","g":5,"d":"1 heaped tsp sweet paprika (5 g), \u00bc tsp caraway, \u00bc tsp dried marjoram, \u2153 tsp salt","cz":"sladk\u00e1 paprika, km\u00edn, major\u00e1nka, s\u016fl"},{"f":"F44","g":5,"d":"1\u20132 garlic cloves","cz":"\u010desnek"},{"f":"F31","g":5,"d":"5 g oil (1 tsp)","cz":"olivov\u00fd olej"},{"f":"F21","g":200,"d":"200 g potatoes","cz":"brambory"}],"steps":["Cut 150 g beef into 3 cm cubes, dice 120 g onion and crush 1\u20132 garlic cloves.","Heat 5 g oil (1 tsp) in the small pot on medium (3\u20134). Fry the onion slowly for 10 min, stirring, until golden \u2013 this thickens the goulash, so no flour is needed.","Turn up to medium\u2013high (4\u20135), add the beef and brown it for 5 min. Stir in 20 g tomato paste, 1 heaped tsp sweet paprika (5 g) and \u00bc tsp caraway for 1 min \u2013 lift the pot off the plate if it starts to catch.","Add the garlic, \u2153 tsp salt and enough boiling water from the kettle to just cover (about 250 ml). Lid on, low (1\u20132), simmer 1 h 15 min\u20131 h 30 min until the beef is tender. Check every 20 min and top up with a splash of water. Stir in \u00bc tsp dried marjoram at the end.","Potatoes (the pot is busy): about 20 min before the goulash is ready, cut 200 g potatoes into 2 cm cubes, toss with a pinch of salt and 1 tsp water, and Air Fry at 200 \u00b0C for 18\u201320 min, shaking halfway. Serve with the goulash."],"tips":["Cook it on Sunday afternoon \u2013 it tastes better on day 2."],"storage":"Fridge 4 days; freezes well.","note":"","equip":["Small pot + lid","Kettle","Air fryer (potatoes)"]},"D8":{"id":"D8","label":"D8 \u00b7 Beef meatballs in tomato sauce with pasta","type":"Dinner","en":"Beef meatballs in tomato sauce with pasta","cz":"Hov\u011bz\u00ed masov\u00e9 kuli\u010dky v raj\u010datov\u00e9 om\u00e1\u010dce","mins":30,"batch":true,"office":false,"anchor":647,"ing":[{"f":"F03","g":130,"d":"130 g lean beef mince (<10% fat)","cz":"hov\u011bz\u00ed mlet\u00e9 maso (do 10 % tuku)"},{"f":"F33","g":200,"d":"200 g chopped tomatoes","cz":"kr\u00e1jen\u00e1 raj\u010data (konzerva)"},{"f":"F43","g":40,"d":"40 g onion","cz":"cibule"},{"f":"F44","g":5,"d":"1\u20132 garlic cloves","cz":"\u010desnek"},{"f":"F22","g":50,"d":"50 g wholegrain pasta (dry)","cz":"celozrnn\u00e9 t\u011bstoviny"},{"f":"F16","g":10,"d":"10 g Eidam 30%, grated","cz":"eidam 30 %"},{"f":"F31","g":3,"d":"3 g oil (\u00bd tsp)","cz":"olivov\u00fd olej"},{"f":"F35","g":1,"d":"\u00bc tsp salt, pinch of black pepper, \u00bd tsp dried oregano (or basil)","cz":"s\u016fl, pep\u0159, oregano, bazalka"}],"steps":["Grate 40 g onion. Mix 130 g lean beef mince with half the onion, \u00bc tsp salt, a pinch of black pepper and \u00bd tsp dried oregano, then roll it into 6 balls with wet hands.","Heat 3 g oil (\u00bd tsp) in the frying pan on medium\u2013high (4\u20135) and brown the balls for 4\u20135 min, turning.","Add the rest of the onion and 1 crushed garlic clove for 1 min, then 200 g chopped tomatoes and a pinch of salt. Turn to low (2), cover with a plate and simmer 12 min.","Meanwhile boil the kettle and cook 50 g pasta in the small pot with 1 tsp salt as the pack says (10\u201312 min). Drain.","Serve the meatballs and sauce over the pasta with 10 g grated Eidam on top."],"tips":[],"storage":"Fridge 3 days, freezer 3 months.","note":"","equip":["Frying pan + a plate as a lid","Small pot","Kettle"]},"F1":{"id":"F1","label":"F1 \u00b7 Weekly flex meal (eat out, 1 beer)","type":"Flex","en":"Weekly flex meal (eat out, 1 beer)","cz":"Voln\u00e9 j\u00eddlo 1\u00d7 t\u00fddn\u011b","mins":0,"batch":false,"office":false,"anchor":671,"ing":[{"f":"X05","g":100,"d":"1 restaurant main + 1 beer (\u2248800 kcal)","cz":""}],"steps":["One planned treat meal a week \u2013 enjoy it without guilt.","Good version: a main from the 'better choices' list + 1 beer (or 2 nealko).","Or: half a portion of sv\u00ed\u010dkov\u00e1 or goulash + 1 nealko.","Keep the rest of that day normal and go back to the plan at the next meal \u2013 don't skip meals to 'make up' for it."],"tips":["Planned treats stop the 'I've ruined it' feeling that ends most diets."],"storage":"","note":"No cooking \u2013 eating out","equip":[]},"X1":{"id":"X1","label":"X1 \u00b7 Coffee / tea with milk (daily)","type":"Drinks","en":"Coffee / tea with milk (daily)","cz":"K\u00e1va / \u010daj s ml\u00e9kem","mins":0,"batch":false,"office":true,"anchor":686,"ing":[{"f":"F13","g":200,"d":"200 ml semi-skimmed milk across the day","cz":"polotu\u010dn\u00e9 ml\u00e9ko"}],"steps":["Black coffee, espresso, americano and tea are ~0 kcal \u2013 the milk is what counts.","Skip sugar and syrups; a caf\u00e9 latte with full-fat milk is 150\u2013200 kcal."],"tips":["Drink 2.5\u20133 l of water a day; sparkling water counts."],"storage":"","note":"No cooking  \u00b7  office-friendly","equip":["Kettle"]}},"order":["B1","B2","B3","B4","B5","B6","B7","B8","L1","L2","L3","L4","L5","L6","L7","L8","S1","S2","S3","S4","S5","S6","S7","S8","D1","D2","D3","D4","D5","D6","D7","D8","F1","X1"],"plan":{"Monday":["B1","L1","S1","D1"],"Tuesday":["B3","L1","S7","D6"],"Wednesday":["B4","L6","S3","D2"],"Thursday":["B8","L5","S8","D8"],"Friday":["B8","L4","S4","D4"],"Saturday":["B7","L3","S1","D3"],"Sunday":["B2","L7","S1","D7"]},"prevPlan":{"Monday":["B1","L1","S1","D1"],"Tuesday":["B3","L8","S7","D6"],"Wednesday":["B5","L6","S3","D2"],"Thursday":["B7","L5","S8","D8"],"Friday":["B8","L8","S4","D4"],"Saturday":["B1","L3","S4","F1"],"Sunday":["B2","L7","S1","D7"]},"planVer":"2026-10-03b","prep":["1.  Rice (small pot + kettle): 280 g basmati + 560 ml boiling water + \u00bd tsp salt \u2192 bring to the boil on high, lid on, low (1) for 12 min, then 5 min resting with the lid on. Covers the chicken-rice lunch, burrito bowl, curry, stir-fry and paprikash for 3\u20134 days.","2.  Chicken (air fryer): season 4 \u00d7 150 g breasts as in L1 and Air Fry at 200 \u00b0C for 14 min in one layer, turning after 7 min. Slice and box for lunches L1 and L7.","3.  Soup (small pot): cook the lentil soup (L6) for Wednesday\u2019s lunch \u2013 it keeps 4 days in the fridge.","4.  Eggs (small pot + kettle): simmer 6\u20138 eggs for 9 min for snacks and salads.","5.  Frittata (frying pan): cook a frittata (B8) for each of the Thursday and Friday breakfasts \u2013 it keeps 4 days in the fridge.","6.  Overnight oats: fill a jar (B4) for Wednesday.","7.  Veg: wash and cut cucumbers and peppers; keep them in boxes lined with kitchen paper (4 days).","Food safety: cooked chicken, rice and fish keep 3 days in the fridge (cool rice within 1 hour). Freeze anything you won't eat by then."],"kitchen":["Hotplates: high = 5\u20136, medium = 3\u20134, low = 1\u20132 on a 0\u20136 dial (on a 0\u20133 dial use 3 / 2 / 1). Solid plates heat up and cool down slowly \u2013 turn down 1\u20132 min early, and lift the pan off if something starts to catch.","Frying pan (non-stick): eggs, pancakes, frittata, curry, chilli, stir-fry, paprikash, meatballs. Use the wooden spatula, never metal.","Small pot with lid: rice, potatoes, pasta, eggs, soup and goulash. Fill it from the kettle \u2013 it saves 5\u201310 min.","Kettle: boil water first for rice, pasta, potatoes and eggs.","Tefal air fryer: Air Fry 200 \u00b0C for chicken, \u0159\u00edzek and potato cubes \u00b7 Air Fry 190 \u00b0C for salmon or white fish \u00b7 Roast 180 \u00b0C for vegetables \u00b7 Reheat for leftovers. No preheating needed. Keep food in one layer; shake or turn halfway.","Whirlpool JetChef: Microwave at 750\u2013900 W (or the nearest level) to thaw berries, steam frozen veg (covered, 2 tbsp water) and reheat boxes (stir halfway). Its Forced Air mode works as a small fan oven if the air fryer is busy \u2013 same temperature, about 5 min longer.","Toaster: setting 3\u20134 for rye or wholegrain bread."],"pantry":[["S\u016fl", ech","English","",""],["Mohl bych m\u00edsto knedl\u00edk\u016f va\u0159en\u00e9 brambory?","Could I have boiled potatoes instead of dumplings?","",""],["Je to sma\u017een\u00e9, nebo grilovan\u00e9?","Is it fried or grilled?","",""],["Dresink zvl\u00e1\u0161\u0165, pros\u00edm.","Dressing on the side, please.","",""],["Bez hranolek, rad\u0161i sal\u00e1t, pros\u00edm.","No fries \u2013 a salad instead, please.","",""],["Je v tom vep\u0159ov\u00e9 maso?","Is there pork in it?","",""],["Jedno nealko pivo, pros\u00edm.","One non-alcoholic beer, please.","",""]]},{"title":"DECEMBER SURVIVAL (Christmas markets start late November)","rows":[["\u2022  Aim to be at the 15 Dec checkpoint (Start Here) before the markets get busy \u2013 that leaves room for a few treats.","","",""],["\u2022  One sva\u0159\u00e1k OR one trdeln\u00edk per market visit, not both. Walk there \u2013 the Old Town / Wenceslas Square markets are good step days.","","",""],["\u2022  Cukrov\u00ed (Christmas cookies): ~50\u201380 kcal each. Put 3 on a plate rather than eating from the box.","","",""],["\u2022  Christmas Eve fried carp + potato salad is ~1,200 kcal \u2013 enjoy it, then go straight back to the plan on the 25th.","","",""]]}],"officeDays":["Tuesday","Wednesday","Thursday"],"refKcal":1650,"refProtein":130,"tpl":{"B1":{"d":["{{F10:250:g:1}} plain skyr","{{F18:35:g:1}} rolled oats [[F18|(\u22484 tbsp)]]","{{F36:100:g:1}} frozen mixed berries","{{F30:5:g:1}} honey [[F30|(1 tsp)]]","\u215b tsp cinnamon"],"steps":["Tip {{F36:100:g:1}} frozen berries into a small bowl. Either thaw them overnight in the fridge, or microwave at 750 W for 1 min, stirring after 30 s.","Put {{F10:250:g:1}} skyr in a bowl and stir in {{F30:5:g:1}} honey [[F30|(1 level tsp)]] and \u215b tsp cinnamon.","Scatter {{F18:35:g:1}} oats [[F18|(4 tbsp)]] on top, then the berries with their juice.","Eat straight away, or leave it 5 min if you like the oats softer."],"tips":["Swap skyr for odtu\u010dn\u011bn\u00fd tvaroh \u2013 same protein, often cheaper.","For crunch, dry-toast the oats in the frying pan on medium for 2\u20133 min.","Big skyr tubs are much cheaper per kg than 140 g pots."],"storage":"Can be packed in a jar the night before (the oats go soft, like overnight oats)."},"B2":{"d":["{{F08:3:egg:1}}","{{F11:50:g:1}} tvaroh [[F11|(\u22482 tbsp)]]","{{F42:80:g:1}} red pepper [[F42|(\u00bd pepper)]]","{{F41:60:g:1}} tomato [[F41|(\u00bd tomato)]]","{{F31:3:g:1}} olive oil [[F31|(\u00bd tsp \u2013 brush it on)]]","{{F19:40:g:1}} wholegrain/rye bread [[F19|(1 slice)]]"],"steps":["Dice {{F42:80:g:1}} red pepper [[F42|(\u00bd pepper)]] and {{F41:60:g:1}} tomato [[F41|(\u00bd tomato)]] into 1 cm pieces.","Heat the frying pan on medium (3\u20134) for 2 min. Brush in {{F31:3:g:1}} oil [[F31|(\u00bd tsp)]] and cook the pepper for 3 min, stirring.","Whisk {{F08:3:egg:1}} with \u215b tsp salt and a pinch of black pepper. Pour over the pepper and tilt the pan so the egg covers the base.","Cook 2 min without stirring until the edges set. Scatter the tomato over and spoon {{F11:50:g:1}} tvaroh [[F11|(2 tbsp)]] onto one half.","Fold the omelette in half, switch the hotplate off and leave it 1 min to finish \u2013 the plate stays hot.","Meanwhile toast 1 slice of bread ({{F19:40:g:1}}) on setting 3\u20134."],"tips":["Brush the oil on \u2013 pouring easily doubles it (+45 kcal).","Add a handful of salad leaves on the side for free volume."],"storage":""},"B3":{"d":["{{F11:250:g:1}} low-fat tvaroh [[F11|(1 tub)]]","1 medium apple (\u2248150 g)","{{F29:10:g:1}} walnuts [[F29|(\u22483 halves)]]","{{F30:5:g:1}} honey [[F30|(1 tsp)]]","\u00bd tsp cinnamon"],"steps":["Put {{F11:250:g:1}} tvaroh [[F11|(1 tub)]] in a bowl with 2\u20133 tbsp water or milk and whisk with a fork for 30 s until creamy.","Dice 1 apple (150 g) and stir half into the tvaroh.","Top with the rest of the apple, {{F29:10:g:1}} chopped walnuts [[F29|(3 halves)]], \u00bd tsp cinnamon and {{F30:5:g:1}} honey [[F30|(1 tsp)]]."],"tips":["Winter version: microwave the diced apple with the cinnamon at 750 W for 1 min \u2013 tastes like apple pie.","Tvaroh is one of the cheapest proteins in Czechia: ~28 g protein per tub."],"storage":""},"B4":{"d":["{{F18:40:g:1}} rolled oats","{{F13:150:ml:1}} semi-skimmed milk","{{F10:150:g:1}} plain skyr","{{F28:10:g:1}} chia seeds [[F28|(1 tbsp)]]","\u00bd small banana (\u224850 g)","\u215b tsp cinnamon"],"steps":["In a 400\u2013500 ml jar or box, mix {{F18:40:g:1}} oats, {{F28:10:g:1}} chia seeds [[F28|(1 tbsp)]], {{F13:150:ml:1}} milk and {{F10:150:g:1}} skyr until no dry oats are left.","Close it and put it in the fridge overnight (at least 4 h).","In the morning stir, slice \u00bd small banana (50 g) on top and add \u215b tsp cinnamon.","Eat it cold, or take the lid off and microwave at 750 W for 1\u20131\u00bd min, stirring halfway."],"tips":["Too thick? Stir in a splash of milk."],"storage":"Fridge up to 3 days."},"B5":{"d":["{{F08:2:egg:1}}","{{F09:50:g:1}} chicken ham [[F09|(2\u20133 slices)]]","{{F19:60:g:1}} rye/wholegrain bread [[F19|(1 large slice)]]","1 tomato (\u2248{{F41:100:g:1}})","{{F40:80:g:1}} cucumber [[F40|(\u00bc cucumber)]]"],"steps":["Whisk {{F08:2:egg:1}} with \u215b tsp salt and a pinch of black pepper. Cut {{F09:50:g:1}} chicken ham [[F09|(2\u20133 slices)]] into strips.","Heat the frying pan on low\u2013medium (2\u20133) for 2 min \u2013 no oil needed in a non-stick pan.","Pour in the eggs and stir slowly with the wooden spatula for 2\u20133 min until just set. Fold in the ham for the last 30 s and slide onto a plate.","Toast 1 large slice of rye bread ({{F19:60:g:1}}) on setting 3\u20134. Slice 1 tomato ({{F41:100:g:1}}) and {{F40:80:g:1}} cucumber on the side."],"tips":["Low heat gives creamy eggs without butter.","Plain '\u0161unka' is pork \u2013 pick 'ku\u0159ec\u00ed \u0161unka nejvy\u0161\u0161\u00ed jakosti' (chicken ham, \u226590% meat)."],"storage":""},"B6":{"d":["{{F19:80:g:1}} wholegrain/rye bread [[F19|(2 slices)]]","{{F11:250:g:1}} tvaroh [[F11|(1 tub)]]","{{F41:80:g:1}} tomato","{{F40:80:g:1}} cucumber"],"steps":["Mix {{F11:250:g:1}} tvaroh [[F11|(1 tub)]] with 2\u20133 tbsp water or milk, \u00bc tsp salt, a pinch of black pepper and \u00bc tsp sweet paprika into a soft spread. Add a little finely chopped onion or chives if you like.","Toast 2 slices of bread ({{F19:80:g:1}}) on setting 3\u20134, or leave them plain.","Spread the tvaroh thickly over both slices and top with {{F41:80:g:1}} sliced tomato and {{F40:80:g:1}} sliced cucumber."],"tips":["Tvarohov\u00e1 pomaz\u00e1nka keeps 2 days in a closed box \u2013 make it the night before and take bread and spread separately to the office."],"storage":""},"B7":{"d":["{{F18:40:g:1}} rolled oats","{{F08:1:egg:1}}","{{F11:150:g:1}} low-fat tvaroh","{{F36:80:g:1}} frozen berries","{{F31:3:g:1}} olive oil (brushed)","\u00bd tsp cinnamon + \u00bd tsp baking powder (optional)"],"steps":["Blitz {{F18:40:g:1}} oats to a coarse flour in a blender, or use them as they are.","In a bowl, mix the oats with {{F08:1:egg:1}}, {{F11:150:g:1}} tvaroh, \u00bd tsp cinnamon and \u00bd tsp baking powder into a thick batter. Add 1\u20132 tbsp water if it's too stiff to drop from a spoon.","Heat the frying pan on medium (3\u20134) for 2 min and brush it with {{F31:3:g:1}} oil [[F31|(\u00bd tsp)]].","Drop in 4 heaped spoonfuls of batter, flatten them slightly and cook 2\u20133 min until golden underneath. Flip and cook 2 min more. The plate keeps getting hotter, so turn down to 2\u20133 after the first batch.","Microwave {{F36:80:g:1}} frozen berries at 750 W for 1 min and spoon them over as a sauce."],"tips":["Weekend favourite. Leftovers reheat in the microwave at 750 W for 30\u201340 s."],"storage":"Fridge 2 days."},"B8":{"d":["{{F08:3:egg:1}}","{{F42:50:g:1}} red pepper","{{F43:20:g:1}} onion","{{F16:20:g:1}} Eidam 30%, grated","1 apple (\u2248150 g)"],"steps":["Finely dice {{F42:50:g:1}} red pepper and {{F43:20:g:1}} onion.","Put the frying pan on medium (3\u20134). Add the veg with 1 tbsp water (no oil) and cook 3\u20134 min, stirring, until soft and the water has gone.","Whisk {{F08:3:egg:1}} with \u215b tsp salt, a pinch of black pepper and a pinch of dried oregano. Pour over the veg, spread it out and stir once.","Turn the hotplate to low (1\u20132). Cover the pan with a large plate or the pot lid and cook 5\u20136 min, until the edges are set and the middle is almost firm.","Scatter {{F16:20:g:1}} grated Eidam over, cover again and cook 2 min until the top is set and the cheese has melted.","Slide it onto a plate and eat it with 1 apple. For the office, let it cool, box it and eat it cold or warm it for 40 s at 750 W."],"tips":["No special tin needed. Add a handful of spinach or chopped chicken ham for variety."],"storage":"Fridge 4 days in a closed box \u2013 perfect grab-and-go for office days."},"L1":{"d":["{{F01:150:g:1}} chicken breast (raw weight)","{{F20:70:g:1}} basmati rice (dry)","{{F39:60:g:1}} salad mix","{{F40:100:g:1}} cucumber","1 tomato (\u2248{{F41:100:g:1}})","{{F31:5:g:1}} olive oil [[F31|(1 tsp)]] + lemon or vinegar","\u00bc tsp salt, \u215b tsp black pepper, \u00bd tsp sweet paprika, \u00bc tsp garlic powder"],"steps":["Rice: boil the kettle. Rinse {{F20:70:g:1}} basmati in a sieve, put it in the small pot with {{F20:70:ml:2}} boiling water and a pinch of salt. Bring back to the boil on high, put the lid on, turn to low (1) and cook 12 min. Switch off and leave 5 min with the lid on.","Chicken: rub {{F01:150:g:1}} chicken breast with \u00bc tsp salt, \u215b tsp black pepper, \u00bd tsp sweet paprika and \u00bc tsp garlic powder. If it's thicker than 2 cm, slice it in half horizontally.","Air fryer: Air Fry, 200 \u00b0C, 12 min (no preheating). Turn the chicken after 6 min. It's done when the thickest part is white all through (74 \u00b0C). Rest 3 min, then slice.","Salad: chop {{F39:60:g:1}} salad mix, {{F40:100:g:1}} cucumber and 1 tomato ({{F41:100:g:1}}). Dress with {{F31:5:g:1}} olive oil [[F31|(1 tsp)]], 1 tsp lemon juice or vinegar and a pinch of salt.","Box it: rice + chicken + salad. Keep the dressing in a small separate pot if it's for the office."],"tips":["At the office, eat it cold or microwave the rice and chicken 1\u20131\u00bd min; keep the salad separate."],"storage":"Fridge 3\u20134 days."},"L2":{"d":["{{F06:130:g:1}} salmon fillet","{{F21:250:g:1}} potatoes","{{F47:150:g:1}} frozen green beans","\u00bc tsp salt, pinch of black pepper, \u00bd tsp dried dill, 2 lemon slices"],"steps":["Potatoes: boil the kettle. Peel or scrub {{F21:250:g:1}} potatoes and cut them into 3 cm pieces. Put them in the small pot, cover with boiling water and add \u00bd tsp salt. Simmer on medium (3\u20134), lid tilted, for 15\u201318 min until a knife slides in.","Salmon: season {{F06:130:g:1}} salmon with \u00bc tsp salt, a pinch of black pepper and \u00bd tsp dried dill, and lay 2 lemon slices on top. If it's frozen, thaw it overnight in the fridge first.","Air fryer: salmon in skin-side down. Air Fry, 190 \u00b0C, 10 min \u2013 it's done when it flakes easily.","Green beans: put {{F47:150:g:1}} frozen beans in a microwave-safe bowl with 2 tbsp water, cover with a plate and microwave at 900 W for 4\u20135 min. Drain.","Plate the potatoes, beans and salmon and squeeze a lemon wedge over everything."],"tips":["Salmon is the most expensive option \u2013 frozen portions are cheaper.","Swap for frozen Alaska pollock (treska): Air Fry 190 \u00b0C, 12 min \u2013 about half the calories and cost."],"storage":""},"L3":{"d":["{{F01:150:g:1}} chicken breast, flattened to ~1 cm","{{F18:15:g:1}} rolled oats, crushed (the crumb)","{{F14:50:g:1}} plain yogurt ({{F14:20:g:1}} to coat, 30 g for the salad)","{{F21:250:g:1}} potatoes","{{F40:150:g:1}} cucumber","{{F31:4:g:1}} oil (brush the tray and crust)","\u00bd tsp sweet paprika, \u00bc tsp salt, \u215b tsp black pepper, \u00bc tsp dried dill","\u00bd garlic clove (for the salad)"],"steps":["Potatoes: boil the kettle. Cut {{F21:250:g:1}} potatoes into 3 cm pieces, cover with boiling water in the small pot, add \u00bd tsp salt and simmer on medium (3\u20134), lid tilted, 15\u201318 min. Drain.","Flatten {{F01:150:g:1}} chicken breast to about 1 cm between two layers of cling film (or inside a freezer bag), tapping it with the bottom of the pot. Season both sides with \u00bc tsp salt, \u215b tsp black pepper and \u00bd tsp sweet paprika.","Crush {{F18:15:g:1}} oats [[F18|(2 tbsp)]] in a bag with the pot or your hands. Spread {{F14:20:g:1}} yogurt over both sides of the chicken, then press it into the oats.","Air fryer: brush the basket with a little of the {{F31:4:g:1}} oil, lay the \u0159\u00edzek in and brush the top with the rest. Air Fry, 200 \u00b0C, 12 min, turning after 7 min. Press Crispy finish for the last 2 min for extra crunch.","Cucumber salad: slice {{F40:150:g:1}} cucumber thinly. Mix with the remaining {{F14:30:g:1}} yogurt, \u00bd crushed garlic clove, \u00bc tsp dried dill and a pinch of salt. Serve with the potatoes."],"tips":["A fried \u0159\u00edzek with potato salad is ~1,100 kcal; this version is about 500.","Cold \u0159\u00edzek is a Czech classic \u2013 fine to eat cold at the office. Freeze extra coated breasts raw and Air Fry them from frozen at 200 \u00b0C for 16\u201318 min."],"storage":""},"L4":{"d":["{{F01:150:g:1}} chicken breast","{{F20:50:g:1}} basmati rice (dry)","{{F26:80:g:1}} kidney beans (drained)","{{F27:50:g:1}} sweetcorn (drained)","{{F33:80:g:1}} chopped tomatoes","{{F43:30:g:1}} onion","{{F42:50:g:1}} red pepper","{{F14:50:g:1}} plain yogurt","\u00bd tsp cumin, \u00bd tsp sweet paprika, \u00bc tsp chilli flakes, \u00bc tsp salt, 1 tsp lime or lemon juice"],"steps":["Rice: rinse {{F20:50:g:1}} basmati and cook it with {{F20:50:ml:2}} boiling water and a pinch of salt in the small pot \u2013 boil on high, lid on, low (1) for 12 min, then rest 5 min.","Cut {{F01:150:g:1}} chicken into 2 cm cubes and toss with \u00bd tsp cumin, \u00bd tsp sweet paprika, \u00bc tsp chilli flakes and \u00bc tsp salt.","Heat the frying pan on high (5\u20136) for 2 min (no oil needed in non-stick). Cook the chicken 5\u20136 min, turning, until white all through.","Turn to medium (3\u20134). Add {{F43:30:g:1}} diced onion and {{F42:50:g:1}} diced red pepper for 2 min, then {{F26:80:g:1}} drained kidney beans and {{F33:80:g:1}} chopped tomatoes. Simmer 3 min.","Bowl or box: rice, the chicken and bean mix and {{F27:50:g:1}} sweetcorn. Top with {{F14:50:g:1}} yogurt and 1 tsp lime or lemon juice."],"tips":["Yogurt instead of sour cream saves ~80 kcal.","Office: pack the yogurt separately, microwave the bowl 1\u00bd\u20132 min, then add the yogurt."],"storage":"Fridge 3 days."},"L5":{"d":["{{F22:70:g:1}} wholegrain pasta (dry)","1 can tuna in own juice (\u2248{{F07:120:g:1}} drained)","{{F27:50:g:1}} sweetcorn","{{F40:100:g:1}} cucumber","100 g (cherry) tomatoes","{{F14:50:g:1}} plain yogurt","{{F31:5:g:1}} olive oil [[F31|(1 tsp)]]","1 tsp lemon juice, \u00bc tsp salt, pinch of black pepper, \u00bd tsp dried dill (or chives)"],"steps":["Boil 1 l water in the kettle and pour it into the small pot on high. Add 1 tsp salt and {{F22:70:g:1}} pasta and cook as the pack says (usually 10\u201312 min). Drain and rinse with cold water.","Dressing: mix {{F14:50:g:1}} yogurt, {{F31:5:g:1}} olive oil [[F31|(1 tsp)]], 1 tsp lemon juice, \u00bc tsp salt, a pinch of black pepper and \u00bd tsp dried dill.","Mix the pasta with 1 can drained tuna ({{F07:120:g:1}}), {{F27:50:g:1}} sweetcorn, {{F40:100:g:1}} diced cucumber and {{F41:100:g:1}} halved cherry tomatoes, then fold in the dressing."],"tips":["Buy tuna 've vlastn\u00ed \u0161\u0165\u00e1v\u011b' (own juice), not 'v oleji' (oil) \u2013 ~100 kcal less per can.","No microwave needed \u2013 ideal office lunch."],"storage":"Fridge 2 days."},"L6":{"d":["{{F25:50:g:1}} red lentils (dry)","{{F01:120:g:1}} chicken breast","{{F45:100:g:1}} carrot","{{F43:60:g:1}} onion","1\u20132 garlic cloves","{{F33:100:g:1}} chopped tomatoes","{{F31:5:g:1}} olive oil [[F31|(1 tsp)]]","{{F19:40:g:1}} bread [[F19|(1 slice)]] on the side","\u00bd tsp cumin, \u00bd tsp sweet paprika, \u00bd bay leaf, \u2153 tsp salt; 350 ml water"],"steps":["Dice {{F43:60:g:1}} onion, {{F45:100:g:1}} carrot and 1\u20132 garlic cloves. Cut {{F01:120:g:1}} chicken breast into 2 cm cubes.","Heat {{F31:5:g:1}} olive oil [[F31|(1 tsp)]] in the small pot on medium (3\u20134). Cook the onion, carrot and garlic 5 min, stirring.","Stir in \u00bd tsp cumin and \u00bd tsp sweet paprika for 30 s.","Add {{F25:50:g:1}} rinsed red lentils, {{F33:100:g:1}} chopped tomatoes, {{F35:350:ml:1}} boiling water from the kettle, \u00bd bay leaf and \u2153 tsp salt. Bring to the boil on high.","Add the chicken, tilt the lid on, turn to low\u2013medium (2\u20133) and simmer 20 min, stirring now and then, until the lentils fall apart. Add a splash of water if it gets too thick.","Take out the bay leaf, taste for salt and add a squeeze of lemon. Serve with {{F19:40:g:1}} bread [[F19|(1 slice)]] on the side."],"tips":["Office: microwave 2\u20133 min, stirring halfway; take the bread separately."],"storage":"Fridge 4 days, freezer 3 months."},"L7":{"d":["1 wholegrain tortilla (\u224860 g)","{{F01:130:g:1}} chicken breast","{{F16:20:g:1}} Eidam 30%, grated","{{F39:30:g:1}} salad leaves","{{F41:60:g:1}} tomato","{{F40:60:g:1}} cucumber","{{F14:40:g:1}} plain yogurt (for the sauce)","\u00bd garlic clove","1 apple"],"steps":["Cut {{F01:130:g:1}} chicken into strips and season with \u00bc tsp salt, a pinch of black pepper and \u00bd tsp sweet paprika \u2013 or use chicken cooked on Sunday.","Cook in the frying pan on high (5\u20136), no oil, 5\u20136 min, turning, until white all through. Air fryer option: Air Fry 200 \u00b0C, 8 min, shaking halfway.","Sauce: mix {{F14:40:g:1}} yogurt with \u00bd crushed garlic clove and a pinch of salt.","Warm 1 tortilla in the dry frying pan, 20 s per side. Spread the sauce over it and add {{F39:30:g:1}} salad leaves, {{F41:60:g:1}} sliced tomato, {{F40:60:g:1}} cucumber sticks, the chicken and {{F16:20:g:1}} grated Eidam.","Fold in the sides, roll tightly and cut in half. Pack with 1 apple."],"tips":["Wrap it in foil for the office.","Check the tortilla label: ~170\u2013180 kcal per wrap is normal; 'XXL' wraps can be 250+."],"storage":""},"L8":{"d":["1 restaurant lunch following the ordering rules"],"steps":["Pick 'grilovan\u00fd / pe\u010den\u00fd / du\u0161en\u00fd' (grilled / roasted / stewed) meat or fish.","Side: 'va\u0159en\u00e9 brambory' (boiled potatoes) or rice + a salad. Skip knedl\u00edky, hranolky and cream sauces.","If soup is included, choose 'v\u00fdvar' (clear broth) over cream soups.","Ask: 'Mohl bych m\u00edsto knedl\u00edk\u016f va\u0159en\u00e9 brambory?' (Could I have boiled potatoes instead of dumplings?)","Big portion? Leave about a quarter of the side dish."],"tips":["See the 'Eating Out' sheet for good and bad dishes and their calories.","Many Czech dishes are pork ('vep\u0159ov\u00e9') \u2013 look for 'ku\u0159ec\u00ed' (chicken) or 'hov\u011bz\u00ed' (beef) in the name. Pluxee vouchers cover part of the cost."],"storage":""},"S1":{"d":["{{F11:250:g:1}} tvaroh [[F11|(1 tub)]]","{{F40:100:g:1}} cucumber"],"steps":["Whisk {{F11:250:g:1}} tvaroh [[F11|(1 tub)]] with 2\u20133 tbsp water or milk, a pinch of salt, a pinch of black pepper and \u00bc tsp sweet paprika (or chopped chives) until creamy. Slice {{F40:100:g:1}} cucumber and use it to dip or spread."],"tips":["27 g protein for under 180 kcal \u2013 one of the best snacks you can buy in a Czech supermarket."],"storage":""},"S2":{"d":["{{F08:2:egg:1}}","1 apple"],"steps":["Boil the kettle. Lower {{F08:2:egg:1}} into the small pot, cover with the boiling water and simmer on medium (3\u20134) for 9 min.","Cool in cold water for 2 min, peel, add a pinch of salt and eat with 1 apple."],"tips":[],"storage":"Boiled eggs keep 5 days in the fridge."},"S3":{"d":["1 pot (200 g)"],"
